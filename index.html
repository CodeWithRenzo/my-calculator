
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Calculator</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #eef2ff;
      font-family: Arial, sans-serif;
    }

    .calculator {
      width: min(340px, 92vw);
      padding: 24px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px #00000015;
    }

    h1 {
      text-align: center;
      color: #273469;
      font-size: 25px;
    }

    #display {
      width: 100%;
      height: 65px;
      margin-bottom: 16px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      text-align: right;
      font-size: 28px;
      background: #f8fafc;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
    }

    button {
      min-height: 55px;
      border: none;
      border-radius: 10px;
      background: #e8ecf5;
      font-size: 20px;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(0.95);
    }

    .operator {
      background: #dbe4ff;
      color: #273469;
    }

    .clear {
      background: #ffe0e0;
      color: #a11;
    }

    .equals {
      background: #273469;
      color: white;
    }

    .zero {
      grid-column: span 2;
    }
  </style>
</head>
<body>
  <main class="calculator">
    <h1>My Calculator</h1>
    <input id="display" value="0" readonly aria-label="Calculator display">

    <div class="buttons">
      <button class="clear" onclick="clearAll()">AC</button>
      <button onclick="removeLast()">DEL</button>
      <button class="operator" onclick="choose('/')">÷</button>
      <button class="operator" onclick="choose('*')">×</button>

      <button onclick="digit('7')">7</button>
      <button onclick="digit('8')">8</button>
      <button onclick="digit('9')">9</button>
      <button class="operator" onclick="choose('-')">−</button>

      <button onclick="digit('4')">4</button>
      <button onclick="digit('5')">5</button>
      <button onclick="digit('6')">6</button>
      <button class="operator" onclick="choose('+')">+</button>

      <button onclick="digit('1')">1</button>
      <button onclick="digit('2')">2</button>
      <button onclick="digit('3')">3</button>
      <button class="equals" onclick="calculate()" style="grid-row: span 2">=</button>

      <button class="zero" onclick="digit('0')">0</button>
      <button onclick="digit('.')">.</button>
    </div>
  </main>

  <script>
    const display = document.getElementById('display');

    let current = '0';
    let stored = null;
    let operator = null;
    let fresh = false;

    function update() {
      display.value = current;
    }

    function digit(value) {
      if (current === 'Error') clearAll();

      if (fresh) {
        current = value === '.' ? '0.' : value;
        fresh = false;
      } else if (value === '.') {
        if (!current.includes('.')) current += '.';
      } else {
        current = current === '0' ? value : current + value;
      }

      update();
    }

    function choose(op) {
      if (current === 'Error') return;

      if (operator && !fresh) calculate();

      stored = Number(current);
      operator = op;
      fresh = true;
    }

    function calculate() {
      if (operator === null || stored === null) return;

      const a = stored;
      const b = Number(current);
      let result;

      switch (operator) {
        case '+': result = a + b; break;
        case '-': result = a - b; break;
        case '*': result = a * b; break;
        case '/':
          if (b === 0) {
            current = 'Error';
            stored = null;
            operator = null;
            fresh = true;
            update();
            return;
          }
          result = a / b;
          break;
      }

      current = String(Number(result.toPrecision(10)));
      stored = null;
      operator = null;
      fresh = true;
      update();
    }

    function clearAll() {
      current = '0';
      stored = null;
      operator = null;
      fresh = false;
      update();
    }

    function removeLast() {
      if (fresh || current === 'Error') {
        current = '0';
        fresh = false;
      } else {
        current = current.length > 1
          ? current.slice(0, -1)
          : '0';

        if (current === '-') current = '0';
      }

      update();
    }
  </script>
</body>
</html>
