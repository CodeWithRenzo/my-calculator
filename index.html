<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#e8eaee">
  <title>Calibre — Calculator</title>
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    (function () {
      try {
        var t = localStorage.getItem('calibre-theme');
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <style>
    /* ============================================================
       Design tokens
       ============================================================ */
    :root {
      color-scheme: light;

      --bg: #e8eaee;
      --surface: #ffffff;
      --surface-2: #f3f4f7;
      --surface-3: #e9ecf1;
      --display-bg: #f7f8fa;

      --text: #17191f;
      --text-muted: #646c7a;
      --text-subtle: #949ba7;

      --border: #e1e4e9;
      --border-strong: #d3d7df;

      --accent: #2f5bd7;
      --accent-strong: #2447a8;
      --accent-soft: #eef3ff;
      --accent-soft-hover: #e3ebff;

      --danger: #b42318;
      --danger-soft: #fff1f0;
      --danger-soft-hover: #ffe4e1;

      --radius-xl: 24px;
      --radius-lg: 16px;
      --radius-md: 13px;
      --radius-sm: 11px;

      --shadow: 0 1px 2px rgba(23, 25, 31, 0.04),
                0 24px 64px -20px rgba(23, 25, 31, 0.24);

      --mode-duration: 180ms;
      --mode-ease: cubic-bezier(0.2, 0.8, 0.2, 1);

      --drawer-duration: 190ms;
      --drawer-ease: cubic-bezier(0.2, 0.8, 0.2, 1);

      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;

      --bg: #0d0f13;
      --surface: #16191f;
      --surface-2: #1d212a;
      --surface-3: #262b35;
      --display-bg: #111419;

      --text: #eef0f5;
      --text-muted: #9aa3b2;
      --text-subtle: #6d7684;

      --border: #262b35;
      --border-strong: #333a46;

      --accent: #6d8dff;
      --accent-strong: #8ba5ff;
      --accent-soft: #1b2440;
      --accent-soft-hover: #232e52;

      --danger: #ff8074;
      --danger-soft: #2b1715;
      --danger-soft-hover: #381d1a;

      --shadow: 0 1px 2px rgba(0, 0, 0, 0.5),
                0 24px 64px -20px rgba(0, 0, 0, 0.8);
    }

    /* ============================================================
       Base
       ============================================================ */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      overflow-x: hidden;
      overflow-y: auto;
      padding:
        max(clamp(16px, 5vw, 48px), env(safe-area-inset-top))
        max(clamp(16px, 5vw, 48px), env(safe-area-inset-right))
        max(clamp(16px, 5vw, 48px), env(safe-area-inset-bottom))
        max(clamp(16px, 5vw, 48px), env(safe-area-inset-left));
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background-color 220ms ease, color 220ms ease;
    }

    button {
      font-family: inherit;
    }

    /* ============================================================
       App shell
       ============================================================ */
    .calculator {
      position: relative;
      margin: auto;
      width: min(100%, 420px);
      display: flex;
      flex-direction: column;
      gap: clamp(12px, 3vw, 18px);
      padding: clamp(16px, 4vw, 24px);
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      transition: background-color 220ms ease, border-color 220ms ease;
    }

    /* ============================================================
       Header
       ============================================================ */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 2px 2px 0;
    }

    .brand {
      display: flex;
      align-items: baseline;
      min-width: 0;
    }

    .brand h1 {
      margin: 0;
      color: var(--text);
      font-size: 0.94rem;
      font-weight: 650;
      letter-spacing: 0.09em;
      line-height: 1;
      text-transform: uppercase;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ---- Mode toggle ---- */
    .mode-toggle {
      display: inline-flex;
      padding: 2px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .mode-btn {
      padding: 4px 10px;
      font-size: 0.7rem;
      font-weight: 560;
      letter-spacing: 0.02em;
      color: var(--text-muted);
      background: transparent;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      line-height: 1.3;
      transition:
        background-color 110ms ease,
        color 110ms ease,
        box-shadow 110ms ease;
    }

    .mode-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .mode-btn.is-active {
      color: var(--text);
      background: var(--surface);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
    }

    @media (hover: hover) {
      .mode-btn:not(.is-active):hover {
        color: var(--text);
      }
    }

    /* ---- Icon buttons ---- */
    .icon-button {
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      padding: 0;
      color: var(--text-muted);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 10px;
      cursor: pointer;
      transition:
        background-color 110ms ease,
        border-color 110ms ease,
        color 110ms ease,
        transform 70ms ease;
    }

    .icon-button svg {
      width: 17px;
      height: 17px;
    }

    .icon-button:active {
      transform: translateY(1px);
    }

    .icon-button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .icon-button:disabled {
      cursor: not-allowed;
      opacity: 0.38;
    }

    .icon-button.is-copied {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .icon-check { display: none; }
    .icon-button.is-copied .icon-copy { display: none; }
    .icon-button.is-copied .icon-check { display: block; }

    /* Theme icon swap */
    :root[data-theme="dark"] .icon-sun { display: none; }
    :root:not([data-theme="dark"]) .icon-moon { display: none; }

    /* ============================================================
       Display
       ============================================================ */
    .display {
      position: relative;
      min-height: 132px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 6px;
      padding: clamp(14px, 4vw, 20px);
      background: var(--display-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: background-color 220ms ease, border-color 220ms ease;
    }

    .calculator.scientific .display {
      min-height: 120px;
    }

    .display-meta {
      position: absolute;
      top: 9px;
      left: 12px;
      right: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
    }

    .badge {
      padding: 1px 6px;
      color: var(--text-subtle);
      background: var(--surface-3);
      border-radius: 5px;
      font-size: 0.6rem;
      font-weight: 680;
      letter-spacing: 0.09em;
      line-height: 1.55;
      text-transform: uppercase;
    }

    .badge[hidden] { display: none; }

    .badge--active {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .expression {
      min-height: 18px;
      margin: 0;
      overflow: hidden;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-variant-numeric: tabular-nums;
      font-weight: 500;
      letter-spacing: 0.01em;
      line-height: 1.3;
      text-align: right;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .result {
      display: block;
      min-height: 1.1em;
      margin: 0;
      overflow: hidden;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      font-weight: 620;
      letter-spacing: -0.04em;
      line-height: 1.05;
      text-align: right;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: color 100ms ease;
    }

    .result[data-size="lg"] { font-size: clamp(2.4rem, 10vw, 3.5rem); }
    .result[data-size="md"] { font-size: clamp(1.9rem, 8vw, 2.8rem); }
    .result[data-size="sm"] { font-size: clamp(1.5rem, 6.5vw, 2.2rem); }
    .result[data-size="xs"] { font-size: clamp(1.15rem, 5vw, 1.7rem); }
    .result[data-size="xxs"] { font-size: clamp(0.95rem, 4vw, 1.35rem); }

    .result.is-error {
      color: var(--danger);
      font-size: clamp(1.8rem, 8vw, 2.8rem);
    }

    /* ============================================================
       Keypad area
       ============================================================ */
    .keypad-area {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* ---- Collapsible scientific panel ---- */
    .sci-panel {
      display: grid;
      grid-template-rows: 0fr;
      min-height: 0;
      overflow: hidden;
      opacity: 0;
      transition:
        grid-template-rows var(--mode-duration) var(--mode-ease),
        opacity 140ms ease;
    }

    .calculator.scientific .sci-panel {
      grid-template-rows: 1fr;
      opacity: 1;
    }

    .sci-panel > .sci-inner {
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: clamp(6px, 1.8vw, 10px);
      padding-bottom: clamp(10px, 2.4vw, 14px);
    }

    .memory-bar,
    .sci-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(6px, 1.8vw, 10px);
    }

    /* ---- Standard keypad ---- */
    .keypad {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(8px, 2.2vw, 12px);
    }

    /* ============================================================
       Keys
       ============================================================ */
    .key {
      min-height: clamp(52px, 12vw, 64px);
      display: grid;
      place-items: center;
      padding: 0;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: clamp(1.1rem, 4.5vw, 1.35rem);
      font-weight: 520;
      line-height: 1;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition:
        background-color 100ms ease,
        border-color 100ms ease,
        color 100ms ease,
        box-shadow 100ms ease,
        transform 70ms ease;
    }

    .key:active { transform: translateY(1px); }

    .key:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* ---- Variants ---- */
    .key--utility {
      color: var(--text-muted);
      background: var(--surface-3);
      font-size: clamp(0.95rem, 3.8vw, 1.08rem);
      font-weight: 580;
    }

    .key--operator {
      color: var(--accent);
      background: var(--accent-soft);
      font-size: clamp(1.25rem, 5vw, 1.55rem);
      font-weight: 560;
    }

    .key--operator[aria-pressed="true"] {
      color: #ffffff;
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 2px 8px rgba(47, 91, 215, 0.22);
    }

    .key--danger {
      color: var(--danger);
      background: var(--danger-soft);
      font-size: clamp(0.9rem, 3.6vw, 1.02rem);
      font-weight: 650;
    }

    .key--equals {
      color: #ffffff;
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 8px 18px -10px rgba(47, 91, 215, 0.6);
      font-size: clamp(1.35rem, 5vw, 1.65rem);
      font-weight: 600;
    }

    .key--equals:active {
      background: var(--accent-strong);
      border-color: var(--accent-strong);
    }

    /* ---- Scientific function keys ---- */
    .sci-grid .key {
      min-height: clamp(44px, 10.5vw, 56px);
    }

    .key--function {
      color: var(--text-muted);
      background: var(--surface-2);
      font-size: clamp(0.78rem, 3vw, 0.9rem);
      font-weight: 540;
      letter-spacing: 0.01em;
    }

    .key--function[data-func="sqrt"] {
      font-size: clamp(1rem, 4vw, 1.15rem);
    }

    .key--toggle {
      color: var(--accent);
      background: var(--accent-soft);
      font-size: clamp(0.62rem, 2.4vw, 0.7rem);
      font-weight: 680;
      letter-spacing: 0.08em;
    }

    .key--toggle.is-active {
      color: #ffffff;
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 2px 8px rgba(47, 91, 215, 0.22);
    }

    .key--memory {
      min-height: 32px;
      color: var(--text-muted);
      background: var(--surface-3);
      border-radius: 9px;
      font-size: 0.72rem;
      font-weight: 640;
      letter-spacing: 0.04em;
    }

    /* ---- Hover states ---- */
    @media (hover: hover) {
      .icon-button:hover {
        color: var(--text);
        background: var(--surface-2);
      }
      .icon-button.is-copied:hover {
        color: var(--accent);
        background: var(--accent-soft-hover);
      }
      .key:hover {
        background: var(--surface-3);
        border-color: var(--border);
      }
      .key--utility:hover {
        color: var(--text);
        background: var(--border);
      }
      .key--operator:hover {
        background: var(--accent-soft-hover);
      }
      .key--operator[aria-pressed="true"]:hover {
        background: var(--accent-strong);
        border-color: var(--accent-strong);
      }
      .key--danger:hover {
        color: var(--danger);
        background: var(--danger-soft-hover);
      }
      .key--equals:hover {
        background: var(--accent-strong);
        border-color: var(--accent-strong);
      }
      .key--function:hover {
        color: var(--text);
        background: var(--surface-3);
        border-color: var(--border);
      }
      .key--toggle:hover {
        color: var(--accent-strong);
        background: var(--accent-soft-hover);
      }
      .key--toggle.is-active:hover {
        color: #ffffff;
        background: var(--accent-strong);
        border-color: var(--accent-strong);
      }
      .key--memory:hover {
        color: var(--text);
        background: var(--border);
      }
    }

    /* ============================================================
       History drawer
       ============================================================ */
    .history-panel {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-radius: var(--radius-xl);
      transform: translate3d(100%, 0, 0);
      transition: transform var(--drawer-duration) var(--drawer-ease);
      contain: layout paint;
    }

    .history-panel.is-open {
      transform: translate3d(0, 0, 0);
    }

    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: clamp(14px, 3.6vw, 20px) clamp(14px, 3.6vw, 20px);
      border-bottom: 1px solid var(--border);
      flex: 0 0 auto;
    }

    .history-header h2 {
      margin: 0;
      font-size: 0.94rem;
      font-weight: 650;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--text);
    }

    .history-header-actions {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .text-button {
      padding: 6px 10px;
      font-size: 0.78rem;
      font-weight: 560;
      color: var(--danger);
      background: transparent;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 140ms ease, opacity 140ms ease;
    }

    .text-button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .text-button:disabled {
      color: var(--text-subtle);
      cursor: not-allowed;
      opacity: 0.55;
    }

    @media (hover: hover) {
      .text-button:not(:disabled):hover {
        background: var(--danger-soft);
      }
    }

    .history-list {
      flex: 1 1 auto;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: clamp(8px, 2vw, 12px);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .history-entry {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      padding: 12px 14px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      text-align: right;
      cursor: pointer;
      transition:
        background-color 100ms ease,
        border-color 100ms ease;
    }

    .history-entry:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    .history-entry:active {
      background: var(--surface-3);
    }

    @media (hover: hover) {
      .history-entry:hover {
        background: var(--surface-2);
        border-color: var(--border);
      }
    }

    .history-expr {
      max-width: 100%;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-result {
      max-width: 100%;
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 40px 24px;
      color: var(--text-subtle);
      font-size: 0.85rem;
      text-align: center;
      line-height: 1.4;
    }

    .history-empty[hidden] {
      display: none;
    }

    /* ============================================================
       Utilities & responsive refinements
       ============================================================ */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 360px) {
      .calculator {
        gap: 10px;
        padding: 13px;
      }
      .display { min-height: 112px; }
      .calculator.scientific .display { min-height: 104px; }
      .keypad { gap: 7px; }
      .sci-panel > .sci-inner { gap: 6px; padding-bottom: 9px; }
      .memory-bar, .sci-grid { gap: 6px; }
      .key {
        min-height: 48px;
        border-radius: 10px;
      }
      .sci-grid .key { min-height: 40px; }
      .brand h1 { font-size: 0.85rem; }
      .mode-btn { padding: 3px 8px; font-size: 0.65rem; }
      .icon-button { width: 30px; height: 30px; }
      .header-actions { gap: 3px; }
      .history-result { font-size: 1.15rem; }
    }

    @media (max-width: 480px) {
      body {
        padding:
          max(12px, env(safe-area-inset-top))
          max(12px, env(safe-area-inset-right))
          max(12px, env(safe-area-inset-bottom))
          max(12px, env(safe-area-inset-left));
      }

      .calculator {
        width: 100%;
        padding: 16px;
        gap: 14px;
        border-radius: 22px;
      }

      .display {
        min-height: 116px;
      }

      .calculator.scientific .display {
        min-height: 108px;
      }
    }

    @media (max-height: 760px) {
      body {
        padding-top: 10px;
        padding-bottom: 10px;
      }
      .calculator {
        gap: 10px;
        padding: 14px;
      }
      .display { min-height: 104px; padding: 12px 16px; }
      .calculator.scientific .display { min-height: 100px; }
      .key { min-height: 46px; }
      .sci-grid .key { min-height: 40px; }
      .key--memory { min-height: 28px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        transition-delay: 0ms !important;
        animation-duration: 0.01ms !important;
        animation-delay: 0ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main class="calculator" id="calculator" aria-labelledby="app-title">
    <header class="app-header" id="appHeader">
      <div class="brand">
        <h1 id="app-title">Calibre</h1>
      </div>

      <div class="header-actions">
        <button
          id="historyBtn"
          class="icon-button"
          type="button"
          aria-label="Open calculation history"
          aria-expanded="false"
          aria-controls="historyPanel"
          title="History"
        >
          <svg
            aria-hidden="true"
            focusable="false"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
            <path d="M12 7v5l4 2"></path>
          </svg>
        </button>

        <div class="mode-toggle" role="group" aria-label="Calculator mode">

          <button id="clearHistoryBtn" class="text-button" type="button" aria-label="Clear all history" disabled>Clear</button>
          <button id="closeHistoryBtn" class="icon-button" type="button" aria-label="Close history" title="Close">

              fill="none" stroke="currentColor" stroke-width="2"

  </main>

  <script>
    (() => {
      'use strict';

      /* ============================================================
         Element references
         ============================================================ */
      const calculator = document.getElementById('calculator');
      const appHeader = document.getElementById('appHeader');
      const displaySection = document.getElementById('displaySection');
      const keypadArea = document.getElementById('keypadArea');
      const resultEl = document.getElementById('result');
      const expressionEl = document.getElementById('expression');
      const keypad = document.getElementById('keypad');
      const sciPanel = document.getElementById('sciPanel');
      const copyBtn = document.getElementById('copyBtn');
      const copyStatus = document.getElementById('copyStatus');
      const themeBtn = document.getElementById('themeBtn');
      const secondBtn = document.getElementById('secondBtn');
      const memoryBadge = document.getElementById('memoryBadge');
      const angleBadge = document.getElementById('angleBadge');
      const modeButtons = Array.from(document.querySelectorAll('.mode-btn'));
      const operatorButtons = Array.from(
        document.querySelectorAll('[data-action="operator"]')
      );
      const angleButton = document.querySelector('[data-action="angle"]');
      const altFuncButtons = Array.from(document.querySelectorAll('[data-alt-func]'));

      const historyBtn = document.getElementById('historyBtn');
      const historyPanel = document.getElementById('historyPanel');
      const historyList = document.getElementById('historyList');
      const historyEmpty = document.getElementById('historyEmpty');
      const clearHistoryBtn = document.getElementById('clearHistoryBtn');
      const closeHistoryBtn = document.getElementById('closeHistoryBtn');

      /* ============================================================
         Constants
         ============================================================ */
      const MAX_INPUT_DIGITS = 15;
      const PRECISION = 12;
      const COPY_FEEDBACK_MS = 1400;
      const HISTORY_KEY = 'calibre-history-v1';
      const SETTINGS_KEY = 'calibre-settings-v1';
      const THEME_KEY = 'calibre-theme';
      const MAX_HISTORY = 30;
      const HAPTIC_MS = 8;

      // Longest prefixes first so `asin` wins over `sin`, `exp` over `e`, etc.
      const FUNC_PREFIXES = [
        'pow10', 'asin', 'acos', 'atan', 'sqrt',
        'sin', 'cos', 'tan', 'log', 'exp', 'ln'
      ];

      const FUNC_DISPLAY = Object.freeze({
        sqrt: '√',
        asin: 'sin⁻¹',
        acos: 'cos⁻¹',
        atan: 'tan⁻¹',
        pow10: '10^',
        exp: 'e^',
        sin: 'sin',
        cos: 'cos',
        tan: 'tan',
        log: 'log',
        ln: 'ln'
      });

      const DISPLAY_SYMBOLS = Object.freeze({
        '+': '+', '-': '−', '*': '×', '/': '÷', '^': '^'
      });

      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      /* ============================================================
         Calculator state
         ============================================================ */
      const state = {
        expr: '',
        resultValue: null,
        resultStr: '',
        lastExpression: '',
        error: null,
        justEvaluated: false,
        angleMode: 'DEG',
        mode: 'basic',
        second: false,
        memory: 0,
        repeat: null // { op, operand } for repeated equals
      };

      let copiedTimer = null;
      let historyOpen = false;
      let historyTrigger = null;
      let historyDirty = true;

      /* ============================================================
         Settings persistence
         ============================================================ */
      function loadSettings() {
        try {
          const raw = localStorage.getItem(SETTINGS_KEY);
          if (!raw) return {};
          const parsed = JSON.parse(raw);
          return parsed && typeof parsed === 'object' ? parsed : {};
        } catch {
          return {};
        }
      }

      function saveSettings() {
        try {
          localStorage.setItem(SETTINGS_KEY, JSON.stringify({
            mode: state.mode,
            angleMode: state.angleMode,
            second: state.second
          }));
        } catch {
          // Storage unavailable; settings are session-only.
        }
      }

      /* ============================================================
         History persistence
         ============================================================ */
      let historyEntries = loadHistory();

      function loadHistory() {
        try {
          const raw = localStorage.getItem(HISTORY_KEY);
          if (!raw) return [];
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) return [];
          return parsed
            .filter(
              (entry) =>
                entry &&
                typeof entry.expr === 'string' &&
                typeof entry.result === 'string' &&
                typeof entry.value === 'number' &&
                Number.isFinite(entry.value)
            )
            .slice(0, MAX_HISTORY);
        } catch {
          return [];
        }
      }

      function saveHistory() {
        try {
          localStorage.setItem(HISTORY_KEY, JSON.stringify(historyEntries));
        } catch {
          // Storage unavailable; history is session-only.
        }
      }

      function addToHistory(expr, result, value) {
        const top = historyEntries[0];
        if (top && top.expr === expr && top.result === result) return;

        historyEntries.unshift({ expr, result, value });
        if (historyEntries.length > MAX_HISTORY) {
          historyEntries.length = MAX_HISTORY;
        }
        saveHistory();
        historyDirty = true;
        if (historyOpen) renderHistory();
      }

      function renderHistory() {
        if (!historyDirty) return;

        const fragment = document.createDocumentFragment();
        clearHistoryBtn.disabled = historyEntries.length === 0;
        historyEmpty.hidden = historyEntries.length !== 0;

        for (let i = 0; i < historyEntries.length; i++) {
          const entry = historyEntries[i];
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'history-entry';
          btn.dataset.index = String(i);
          btn.setAttribute('role', 'listitem');
          btn.setAttribute(
            'aria-label',
            `Use result ${entry.result}, from ${entry.expr}`
          );

          const exprSpan = document.createElement('span');
          exprSpan.className = 'history-expr';
          exprSpan.textContent = entry.expr;

          const resultSpan = document.createElement('span');
          resultSpan.className = 'history-result';
          resultSpan.textContent = entry.result;

          btn.append(exprSpan, resultSpan);
          fragment.appendChild(btn);
        }

        historyList.replaceChildren(fragment);
        historyDirty = false;
      }

      function useHistoryEntry(idx) {
        const entry = historyEntries[idx];
        if (!entry) return;

        state.expr = toPlainString(entry.value);
        state.resultValue = entry.value;
        state.resultStr = entry.result;
        state.lastExpression = entry.expr + ' =';
        state.justEvaluated = true;
        state.error = null;
        state.repeat = null;

        closeHistory();
        render();
      }

      function clearHistory() {
        historyEntries = [];
        saveHistory();
        historyDirty = true;
        if (historyOpen) renderHistory();
      }

      /* ============================================================
         History drawer open/close
         ============================================================ */
      function openHistory() {
        if (historyOpen) return;
        historyOpen = true;
        historyTrigger = document.activeElement;

        renderHistory();
        historyPanel.classList.add('is-open');
        historyPanel.inert = false;
        historyPanel.setAttribute('aria-hidden', 'false');
        historyBtn.setAttribute('aria-expanded', 'true');

        appHeader.inert = true;
        displaySection.inert = true;
        keypadArea.inert = true;

        closeHistoryBtn.focus({ preventScroll: true });
      }

      function closeHistory() {
        if (!historyOpen) return;
        historyOpen = false;

        historyPanel.classList.remove('is-open');
        historyPanel.inert = true;
        historyPanel.setAttribute('aria-hidden', 'true');
        historyBtn.setAttribute('aria-expanded', 'false');

        appHeader.inert = false;
        displaySection.inert = false;
        keypadArea.inert = false;

        const target =
          historyTrigger && document.contains(historyTrigger)
            ? historyTrigger
            : historyBtn;

        requestAnimationFrame(() => {
          try {
            target.focus({ preventScroll: true });
          } catch {
            historyBtn.focus({ preventScroll: true });
          }
        });
      }

      // Trap Tab focus within the panel while it is open.
      historyPanel.addEventListener('keydown', (event) => {
        if (event.key !== 'Tab') return;

        const focusable = historyPanel.querySelectorAll(
          'button:not([disabled]), [href], input:not([disabled]), select, textarea, [tabindex]:not([tabindex="-1"])'
        );
        if (focusable.length === 0) return;

        const first = focusable[0];
        const last = focusable[focusable.length - 1];

        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      });

      /* ============================================================
         Number formatting
         ============================================================ */
      function toPlainString(value) {
        if (!Number.isFinite(value)) return '0';
        if (Object.is(value, -0)) return '0';
        return String(Number(value.toPrecision(PRECISION)));
      }

      function formatNumberForDisplay(value) {
        if (!Number.isFinite(value)) return 'Error';
        if (Object.is(value, -0)) value = 0;

        const rounded = Number(value.toPrecision(PRECISION));
        if (!Number.isFinite(rounded)) return 'Error';

        const abs = Math.abs(rounded);
        if (abs !== 0 && (abs >= 1e12 || abs < 1e-9)) {
          return rounded
            .toExponential(6)
            .replace(/\.?0+e/, 'e')
            .replace('e+', 'e');
        }

        const str = String(rounded);
        if (/[eE]/.test(str)) return str;

        let sign = '';
        let unsigned = str;
        if (unsigned.startsWith('-')) {
          sign = '-';
          unsigned = unsigned.slice(1);
        }

        const [intPart, decPart] = unsigned.split('.');
        const grouped = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        return sign + grouped + (decPart !== undefined ? '.' + decPart : '');
      }

      function getDisplaySize(text) {
        const len = text.length;
        if (len > 30) return 'xxs';
        if (len > 22) return 'xs';
        if (len > 15) return 'sm';
        if (len > 9) return 'md';
        return 'lg';
      }

      /* ============================================================
         Expression display formatter
         ============================================================ */
      function formatExpression(expr) {
        if (!expr) return '';
        let out = '';
        let i = 0;
        let prevType = null;

        while (i < expr.length) {
          const ch = expr[i];

          // Numbers, including scientific notation produced by results.
          if (/[\d.]/.test(ch)) {
            let num = '';
            while (i < expr.length && /[\d.]/.test(expr[i])) num += expr[i++];

            if (i < expr.length && (expr[i] === 'e' || expr[i] === 'E')) {
              const sign = expr[i + 1];
              if ((sign === '+' || sign === '-') && /[0-9]/.test(expr[i + 2] || '')) {
                num += 'e' + sign;
                i += 2;
                while (i < expr.length && /[0-9]/.test(expr[i])) num += expr[i++];
              } else if (/[0-9]/.test(sign || '')) {
                num += 'e';
                i += 1;
                while (i < expr.length && /[0-9]/.test(expr[i])) num += expr[i++];
              }
            }

            out += num;
            prevType = 'number';
            continue;
          }

          // Functions (checked before bare `e` so `exp` is not split).
          let fn = null;
          for (const f of FUNC_PREFIXES) {
            if (expr.startsWith(f, i)) { fn = f; break; }
          }
          if (fn) {
            out += FUNC_DISPLAY[fn] || fn;
            i += fn.length;
            prevType = 'func';
            continue;
          }

          if (ch === 'π' || ch === 'e') {
            out += ch;
            i++;
            prevType = 'const';
            continue;
          }

          if (ch === '(') { out += '('; i++; prevType = 'lparen'; continue; }
          if (ch === ')') { out += ')'; i++; prevType = 'rparen'; continue; }
          if (ch === '!') { out += '!'; i++; prevType = 'postfix'; continue; }

          if ('+-*/^'.includes(ch)) {
            const isUnary =
              prevType === null ||
              prevType === 'op' ||
              prevType === 'lparen' ||
              prevType === 'func';

            const sym = DISPLAY_SYMBOLS[ch];
            out += isUnary ? sym : ' ' + sym + ' ';
            i++;
            prevType = 'op';
            continue;
          }

          i++;
        }

        return out.trim();
      }

      /* ============================================================
         Tokenizer (supports scientific notation, factorial)
         ============================================================ */
      function tokenize(str) {
        const tokens = [];
        let i = 0;

        while (i < str.length) {
          const ch = str[i];

          if (ch === ' ') { i++; continue; }

          if (/[0-9.]/.test(ch)) {
            let num = '';
            while (i < str.length && /[0-9.]/.test(str[i])) num += str[i++];

            // Scientific notation: <digits>[eE][+-]?<digits>
            if (i < str.length && (str[i] === 'e' || str[i] === 'E')) {
              const next = str[i + 1];
              const nextNext = str[i + 2];
              if ((next === '+' || next === '-') && /[0-9]/.test(nextNext)) {
                num += str[i++];
                num += str[i++];
                while (i < str.length && /[0-9]/.test(str[i])) num += str[i++];
              } else if (/[0-9]/.test(next)) {
                num += str[i++];
                while (i < str.length && /[0-9]/.test(str[i])) num += str[i++];
              }
            }

            const value = parseFloat(num);
            if (!Number.isFinite(value)) throw new Error('Invalid number');
            tokens.push({ type: 'number', value });
            continue;
          }

          // Functions first so `exp` is not read as the constant `e`.
          let matched = false;
          for (const fn of FUNC_PREFIXES) {
            if (str.startsWith(fn, i)) {
              tokens.push({ type: 'func', value: fn });
              i += fn.length;
              matched = true;
              break;
            }
          }
          if (matched) continue;

          if ('+-*/^'.includes(ch)) {
            tokens.push({ type: 'op', value: ch });
            i++;
            continue;
          }

          if (ch === '!') { tokens.push({ type: 'postfix', value: 'fact' }); i++; continue; }
          if (ch === '(') { tokens.push({ type: 'lparen' }); i++; continue; }
          if (ch === ')') { tokens.push({ type: 'rparen' }); i++; continue; }
          if (ch === 'π') { tokens.push({ type: 'number', value: Math.PI }); i++; continue; }
          if (ch === 'e') { tokens.push({ type: 'number', value: Math.E }); i++; continue; }

          throw new Error('Invalid character');
        }

        return resolveUnary(tokens);
      }

      function resolveUnary(tokens) {
        const result = [];
        for (const t of tokens) {
          if (t.type === 'op' && (t.value === '-' || t.value === '+')) {
            const prev = result[result.length - 1];
            const isUnary =
              !prev ||
              prev.type === 'op' ||
              prev.type === 'unary' ||
              prev.type === 'lparen' ||
              prev.type === 'func';

            if (isUnary) {
              if (t.value === '-') result.push({ type: 'unary', value: 'neg' });
              continue;
            }
          }
          result.push(t);
        }
        return result;
      }

      /* ============================================================
         Shunting-yard → RPN
         ============================================================ */
      function toRPN(tokens) {
        const output = [];
        const stack = [];

        const prec = { '+': 1, '-': 1, '*': 2, '/': 2, 'neg': 3, '^': 4 };
        const rightAssoc = { '^': true, 'neg': true };

        for (const t of tokens) {
          if (t.type === 'number' || t.type === 'postfix') {
            output.push(t);
          } else if (t.type === 'func') {
            stack.push(t);
          } else if (t.type === 'unary') {
            // Prefix signs apply to the next value; do not pop a pending power.
            stack.push(t);
          } else if (t.type === 'op') {
            const op = t.value;

            while (stack.length > 0) {
              const top = stack[stack.length - 1];

              if (top.type === 'func') {
                output.push(stack.pop());
                continue;
              }

              if (top.type === 'op' || top.type === 'unary') {
                const topOp = top.type === 'unary' ? 'neg' : top.value;
                const shouldPop = rightAssoc[op]
                  ? prec[topOp] > prec[op]
                  : prec[topOp] >= prec[op];

                if (shouldPop) {
                  output.push(stack.pop());
                  continue;
                }
              }
              break;
            }

            stack.push(t);
          } else if (t.type === 'lparen') {
            stack.push(t);
          } else if (t.type === 'rparen') {
            while (stack.length > 0 && stack[stack.length - 1].type !== 'lparen') {
              output.push(stack.pop());
            }
            if (stack.length === 0) throw new Error('Mismatched parentheses');
            stack.pop();
            if (stack.length > 0 && stack[stack.length - 1].type === 'func') {
              output.push(stack.pop());
            }
          }
        }

        while (stack.length > 0) {
          const t = stack.pop();
          if (t.type === 'lparen') throw new Error('Mismatched parentheses');
          output.push(t);
        }

        return output;
      }

      /* ============================================================
         RPN evaluator
         ============================================================ */
      function applyBinary(op, a, b) {
        let result;
        switch (op) {
          case '+': result = a + b; break;
          case '-': result = a - b; break;
          case '*': result = a * b; break;
          case '/':
            if (b === 0) throw new Error('Cannot divide by zero');
            result = a / b;
            break;
          case '^': result = Math.pow(a, b); break;
          default: throw new Error('Unknown operator');
        }
        if (!Number.isFinite(result)) throw new Error('Result is too large');
        return result;
      }

      function factorial(x) {
        if (x < 0 || !Number.isInteger(x)) throw new Error('Invalid factorial');
        if (x > 170) throw new Error('Result is too large');
        let r = 1;
        for (let k = 2; k <= x; k++) r *= k;
        return r;
      }

      function evalRPN(rpn, angleMode) {
        const stack = [];
        const toRad = angleMode === 'DEG' ? Math.PI / 180 : 1;

        for (const t of rpn) {
          if (t.type === 'number') {
            stack.push(t.value);
            continue;
          }

          if (t.type === 'postfix') {
            const x = stack.pop();
            if (x === undefined) throw new Error('Invalid expression');
            stack.push(factorial(x));
            continue;
          }

          if (t.type === 'func') {
            const x = stack.pop();
            if (x === undefined) throw new Error('Invalid expression');

            let result;
            switch (t.value) {
              case 'sin': result = Math.sin(x * toRad); break;
              case 'cos': result = Math.cos(x * toRad); break;
              case 'tan': {
                const rad = x * toRad;
                const c = Math.cos(rad);
                if (Math.abs(c) < 1e-14) throw new Error('Undefined');
                result = Math.sin(rad) / c;
                break;
              }
              case 'asin':
                if (x < -1 || x > 1) throw new Error('Invalid input');
                result = Math.asin(x) / toRad;
                break;
              case 'acos':
                if (x < -1 || x > 1) throw new Error('Invalid input');
                result = Math.acos(x) / toRad;
                break;
              case 'atan':
                result = Math.atan(x) / toRad;
                break;
              case 'log':
                if (x <= 0) throw new Error('Invalid input');
                result = Math.log10(x);
                break;
              case 'ln':
                if (x <= 0) throw new Error('Invalid input');
                result = Math.log(x);
                break;
              case 'pow10':
                result = Math.pow(10, x);
                break;
              case 'exp':
                result = Math.exp(x);
                break;
              case 'sqrt':
                if (x < 0) throw new Error('Invalid input');
                result = Math.sqrt(x);
                break;
              default:
                throw new Error('Unknown function');
            }
            if (!Number.isFinite(result)) throw new Error('Invalid result');
            stack.push(result);
            continue;
          }

          if (t.type === 'unary' || t.type === 'op') {
            const op = t.type === 'unary' ? 'neg' : t.value;

            if (op === 'neg') {
              const x = stack.pop();
              if (x === undefined) throw new Error('Invalid expression');
              stack.push(-x);
              continue;
            }

            const b = stack.pop();
            const a = stack.pop();
            if (a === undefined || b === undefined) {
              throw new Error('Invalid expression');
            }

            stack.push(applyBinary(op, a, b));
          }
        }

        if (stack.length !== 1) throw new Error('Invalid expression');
        return stack[0];
      }

      /* ============================================================
         High-level evaluation
         ============================================================ */
      function evaluate(exprStr, angleMode) {
        return evalRPN(toRPN(tokenize(exprStr)), angleMode);
      }

      function autoClose(exprStr) {
        const open = (exprStr.match(/\(/g) || []).length;
        const close = (exprStr.match(/\)/g) || []).length;
        if (close > open) return null;
        return exprStr + ')'.repeat(open - close);
      }

      function computePreview() {
        if (!state.expr) return null;

        if (
          !/[+\-*/^()πe!]/.test(state.expr) &&
          !/(sin|cos|tan|log|ln|sqrt)/.test(state.expr)
        ) {
          return null;
        }

        const full = autoClose(state.expr);
        if (full === null) return null;

        const stripped = full.replace(/\)+$/, '');
        const lastChar = stripped[stripped.length - 1];
        if ('+-*/^('.includes(lastChar)) return null;

        try {
          const value = evaluate(full, state.angleMode);
          if (!Number.isFinite(value)) return null;
          return formatNumberForDisplay(value);
        } catch {
          return null;
        }
      }

      /* ============================================================
         Input helpers
         ============================================================ */
      function ensureNoError() {
        if (state.error) resetState();
      }

      function clearEvaluated() {
        if (state.justEvaluated) {
          state.expr = '';
          state.resultValue = null;
          state.resultStr = '';
          state.lastExpression = '';
          state.justEvaluated = false;
        }
      }

      // Keep the evaluated result, but turn it back into an editable expression.
      function commitResultToExpression() {
        if (state.justEvaluated && state.resultValue !== null) {
          state.expr = toPlainString(state.resultValue);
          state.resultValue = null;
          state.resultStr = '';
          state.lastExpression = '';
          state.justEvaluated = false;
        }
      }

      function haptic() {
        if (reducedMotion) return;
        if (typeof navigator.vibrate !== 'function') return;
        try { navigator.vibrate(HAPTIC_MS); } catch { /* ignore */ }
      }

      /* ============================================================
         Input actions
         ============================================================ */
      function inputDigit(d) {
        ensureNoError();

        if (state.justEvaluated) {
          state.expr = '';
          state.resultValue = null;
          state.resultStr = '';
          state.lastExpression = '';
          state.justEvaluated = false;
          state.repeat = null;
        }

        const numberMatch = state.expr.match(/[\d.]+$/);

        if (numberMatch) {
          const num = numberMatch[0];

          if (d === '.') {
            if (num.includes('.')) return;
            state.expr += '.';
          } else {
            if (num === '0') {
              state.expr = state.expr.slice(0, -1) + d;
            } else {
              if (num.replace('.', '').length >= MAX_INPUT_DIGITS) return;
              state.expr += d;
            }
          }
        } else {
          const last = state.expr[state.expr.length - 1] || '';
          if (last === ')' || last === 'π' || last === 'e' || last === '!') {
            state.expr += '*';
          }
          state.expr += d === '.' ? '0.' : d;
        }

        render();
      }

      function inputOperator(op) {
        if (state.error) {
          resetState();
          render();
          return;
        }

        commitResultToExpression();

        if (state.expr === '') {
          if (op === '-') state.expr = '-';
          render();
          return;
        }

        const last = state.expr[state.expr.length - 1];

        if (last === '(') {
          if (op === '-') state.expr += '-';
          render();
          return;
        }

        if ('+-*/^'.includes(last)) {
          const beforeLast = state.expr[state.expr.length - 2] || '';

          if (last === '-' && '+-*/^'.includes(beforeLast)) {
            state.expr =
              op === '-'
                ? state.expr.slice(0, -2) + '-'
                : state.expr.slice(0, -2) + op;
          } else if (op === '-' && last !== '-') {
            state.expr += '-';
          } else {
            state.expr = state.expr.slice(0, -1) + op;
          }
        } else {
          state.expr += op;
        }

        render();
      }

      function inputFunction(name) {
        ensureNoError();
        clearEvaluated();

        const last = state.expr[state.expr.length - 1] || '';
        if (last === ')' || last === 'π' || last === 'e' || last === '!' || /[\d.]/.test(last)) {
          state.expr += '*';
        }

        state.expr += name + '(';
        render();
      }

      function inputConstant(c) {
        ensureNoError();
        clearEvaluated();

        const last = state.expr[state.expr.length - 1] || '';
        if (last === ')' || last === 'π' || last === 'e' || last === '!' || /[\d.]/.test(last)) {
          state.expr += '*';
        }

        state.expr += c;
        render();
      }

      function inputNumberLiteral(value) {
        const text = toPlainString(value);
        const last = state.expr[state.expr.length - 1] || '';
        if (last === ')' || last === 'π' || last === 'e' || last === '!' || /[\d.]/.test(last)) {
          state.expr += '*';
        }
        state.expr += text.startsWith('-') ? '(' + text + ')' : text;
      }

      function inputParenLeft() {
        ensureNoError();
        clearEvaluated();

        const last = state.expr[state.expr.length - 1] || '';
        if (last === ')' || last === 'π' || last === 'e' || last === '!' || /[\d.]/.test(last)) {
          state.expr += '*';
        }

        state.expr += '(';
        render();
      }

      function inputParenRight() {
        if (state.error || state.justEvaluated || !state.expr) return;

        const last = state.expr[state.expr.length - 1];
        if ('+-*/^('.includes(last)) return;

        const open = (state.expr.match(/\(/g) || []).length;
        const close = (state.expr.match(/\)/g) || []).length;

        if (open > close) {
          state.expr += ')';
          render();
        }
      }

      function inputPower() {
        ensureNoError();
        commitResultToExpression();

        if (!state.expr) return;

        const last = state.expr[state.expr.length - 1];
        if ('+-*/^('.includes(last)) return;

        state.expr += '^';
        render();
      }

      // Appends ^2 / ^(-1) to the trailing value.
      function appendPower(powerStr) {
        ensureNoError();
        commitResultToExpression();

        if (!state.expr) return;

        const last = state.expr[state.expr.length - 1];
        if (!/[\d)πe!]/.test(last)) return;

        state.expr += '^' + powerStr;
        render();
      }

      function inputFactorial() {
        ensureNoError();
        commitResultToExpression();

        if (!state.expr) return;

        const last = state.expr[state.expr.length - 1];
        if (!/[\d)πe]/.test(last)) return;

        state.expr += '!';
        render();
      }

      function equals() {
        if (state.error) return;

        if (state.justEvaluated) {
          repeatEquals();
          return;
        }

        if (!state.expr) return;

        const stripped = state.expr.replace(/\)+$/, '');
        const lastChar = stripped[stripped.length - 1];
        if ('+-*/^('.includes(lastChar)) return;

        const full = autoClose(state.expr);
        if (full === null) {
          state.error = 'Mismatched parentheses';
          render();
          return;
        }

        try {
          const tokens = tokenize(full);
          const value = evalRPN(toRPN(tokens), state.angleMode);
          if (!Number.isFinite(value)) throw new Error('Invalid result');

          state.lastExpression = formatExpression(full) + ' =';
          state.expr = full;
          state.resultValue = value;
          state.resultStr = formatNumberForDisplay(value);
          state.justEvaluated = true;
          state.error = null;
          state.repeat = detectRepeat(tokens);

          // Only add meaningful computations to history.
          if (tokens.length > 1) {
            addToHistory(formatExpression(full), state.resultStr, value);
          }
        } catch (err) {
          state.error = err.message || 'Invalid expression';
          state.resultValue = null;
          state.resultStr = '';
          state.lastExpression = '';
          state.justEvaluated = false;
          state.repeat = null;
        }

        render();
      }

      // Remember simple `a op b` patterns so a second `=` repeats the operation.
      function detectRepeat(tokens) {
        if (tokens.length !== 3) return null;
        const [a, op, b] = tokens;
        if (a.type !== 'number' || op.type !== 'op' || b.type !== 'number') return null;
        return { op: op.value, operand: b.value };
      }

      function repeatEquals() {
        if (!state.repeat || state.resultValue === null) return;

        const { op, operand } = state.repeat;

        try {
          const value = applyBinary(op, state.resultValue, operand);

          state.lastExpression =
            formatNumberForDisplay(state.resultValue) +
            ' ' + DISPLAY_SYMBOLS[op] + ' ' +
            formatNumberForDisplay(operand) + ' =';

          state.resultValue = value;
          state.resultStr = formatNumberForDisplay(value);
          state.expr = toPlainString(value);

          addToHistory(
            state.lastExpression.replace(/ =$/, ''),
            state.resultStr,
            value
          );
        } catch (err) {
          state.error = err.message || 'Invalid expression';
          state.resultValue = null;
          state.resultStr = '';
          state.lastExpression = '';
          state.justEvaluated = false;
          state.repeat = null;
        }

        render();
      }

      function clearAll() {
        resetState();
        render();
      }

      function backspace() {
        if (state.error) { clearAll(); return; }

        if (state.justEvaluated) {
          resetState();
          render();
          return;
        }

        if (!state.expr) return;

        for (const fn of [...FUNC_PREFIXES].sort((a, b) => b.length - a.length)) {
          if (state.expr.endsWith(fn + '(')) {
            state.expr = state.expr.slice(0, -(fn.length + 1));
            render();
            return;
          }
        }

        state.expr = state.expr.slice(0, -1);
        render();
      }

      function percent() {
        ensureNoError();
        commitResultToExpression();

        if (!state.expr) return;

        const match = state.expr.match(/[\d.]+$/);
        if (!match) return;

        const numStr = match[0];
        const numValue = parseFloat(numStr);
        if (!Number.isFinite(numValue)) return;

        const before = state.expr.slice(0, state.expr.length - numStr.length);
        const opMatch = before.match(/([+\-*/^(])$/);

        let newValue = numValue / 100;

        if (opMatch && (opMatch[1] === '+' || opMatch[1] === '-')) {
          try {
            const leftExpr = before.slice(0, -1);
            if (leftExpr) {
              const leftValue = evaluate(autoClose(leftExpr), state.angleMode);
              newValue = leftValue * numValue / 100;
            }
          } catch {
            // fall through to plain divide-by-100
          }
        }

        state.expr = before + toPlainString(newValue);
        render();
      }

      function toggleSign() {
        ensureNoError();
        commitResultToExpression();

        if (!state.expr) {
          state.expr = '-';
          render();
          return;
        }

        const match = state.expr.match(/[\d.]+$/);

        if (!match) {
          const last = state.expr[state.expr.length - 1];
          if ('+-*/^('.includes(last)) {
            state.expr += '-';
            render();
          }
          return;
        }

        const numStr = match[0];
        const before = state.expr.slice(0, state.expr.length - numStr.length);
        const lastChar = before.slice(-1);

        if (lastChar === '-') {
          const beforeMinus = before.slice(0, -1);
          const charBeforeMinus = beforeMinus.slice(-1);

          if (charBeforeMinus === '' || '+-*/^('.includes(charBeforeMinus)) {
            state.expr = beforeMinus + numStr;
          } else {
            state.expr = beforeMinus + '+' + numStr;
          }
        } else if (lastChar === '+') {
          state.expr = before.slice(0, -1) + '-' + numStr;
        } else {
          state.expr = before + '-' + numStr;
        }

        render();
      }

      /* ============================================================
         Angle mode
         ============================================================ */
      function setAngleMode(mode) {
        state.angleMode = mode === 'RAD' ? 'RAD' : 'DEG';

        if (angleButton) {
          angleButton.textContent = state.angleMode;
          angleButton.setAttribute(
            'aria-label',
            `Angle mode: ${state.angleMode}. Activate to toggle.`
          );
        }

        angleBadge.textContent = state.angleMode;
        saveSettings();
      }

      function toggleAngleMode() {
        setAngleMode(state.angleMode === 'DEG' ? 'RAD' : 'DEG');
        render();
      }

      /* ============================================================
         Second-function toggle
         ============================================================ */
      function setSecond(on) {
        state.second = !!on;

        secondBtn.classList.toggle('is-active', state.second);
        secondBtn.setAttribute('aria-pressed', state.second ? 'true' : 'false');

        altFuncButtons.forEach((btn) => {
          const label = state.second ? btn.dataset.altLabel : btn.dataset.label;
          const aria = state.second ? btn.dataset.altAria : btn.dataset.aria;
          btn.textContent = label;
          if (aria) btn.setAttribute('aria-label', aria);
        });

        saveSettings();
      }

      /* ============================================================
         Memory
         ============================================================ */
      function getCurrentValue() {
        if (state.error) return null;
        if (state.justEvaluated && state.resultValue !== null) return state.resultValue;
        if (!state.expr) return null;

        const full = autoClose(state.expr);
        if (full === null) return null;

        try {
          const value = evaluate(full, state.angleMode);
          return Number.isFinite(value) ? value : null;
        } catch {
          return null;
        }
      }

      function memoryAction(kind) {
        if (kind === 'clear') {
          state.memory = 0;
          render();
          return;
        }

        if (kind === 'recall') {
          if (state.memory === 0) return;
          ensureNoError();
          clearEvaluated();
          inputNumberLiteral(state.memory);
          render();
          return;
        }

        const current = getCurrentValue();
        if (current === null) return;

        state.memory += kind === 'add' ? current : -current;
        if (!Number.isFinite(state.memory)) state.memory = 0;

        // Avoid -0 accumulating from rounded noise.
        if (Object.is(state.memory, -0)) state.memory = 0;

        render();
      }

      /* ============================================================
         Render
         ============================================================ */
      function renderBadges() {
        memoryBadge.hidden = state.memory === 0;
        angleBadge.textContent = state.angleMode;
      }

      function render() {
        renderBadges();

        if (state.error) {
          resultEl.textContent = 'Error';
          resultEl.classList.add('is-error');
          resultEl.dataset.size = 'lg';
          expressionEl.textContent = state.error;
          updateOperatorStates();
          copyBtn.disabled = true;
          return;
        }

        resultEl.classList.remove('is-error');
        copyBtn.disabled = false;

        if (state.justEvaluated && state.resultStr) {
          resultEl.textContent = state.resultStr;
          resultEl.dataset.size = getDisplaySize(state.resultStr);
          expressionEl.textContent = state.lastExpression;
        } else if (state.expr) {
          const displayText = formatExpression(state.expr);
          resultEl.textContent = displayText || '0';
          resultEl.dataset.size = getDisplaySize(displayText);

          const preview = computePreview();
          expressionEl.textContent = preview ? '= ' + preview : '';
        } else {
          resultEl.textContent = '0';
          resultEl.dataset.size = 'lg';
          expressionEl.textContent = '';
        }

        updateOperatorStates();
      }

      function updateOperatorStates() {
        const lastChar = state.expr ? state.expr[state.expr.length - 1] : '';
        operatorButtons.forEach((btn) => {
          const op = btn.dataset.operator;
          btn.setAttribute('aria-pressed', op === lastChar ? 'true' : 'false');
        });
      }

      function resetState() {
        state.expr = '';
        state.resultValue = null;
        state.resultStr = '';
        state.lastExpression = '';
        state.error = null;
        state.justEvaluated = false;
        state.repeat = null;
      }

      /* ============================================================
         Mode
         ============================================================ */
      function setMode(mode) {
        state.mode = mode === 'scientific' ? 'scientific' : 'basic';
        const isSci = state.mode === 'scientific';

        calculator.classList.toggle('scientific', isSci);
        sciPanel.inert = !isSci;

        modeButtons.forEach((btn) => {
          const active = btn.dataset.mode === state.mode;
          btn.classList.toggle('is-active', active);
          btn.setAttribute('aria-pressed', active ? 'true' : 'false');
        });

        saveSettings();
      }

      /* ============================================================
         Theme
         ============================================================ */
      function applyTheme(theme, persist) {
        const value = theme === 'dark' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', value);

        if (persist) {
          try { localStorage.setItem(THEME_KEY, value); } catch { /* ignore */ }
        }

        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', value === 'dark' ? '#0d0f13' : '#e8eaee');

        themeBtn.setAttribute(
          'aria-label',
          value === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'
        );
      }

      function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme') === 'dark'
          ? 'dark'
          : 'light';
        applyTheme(current === 'dark' ? 'light' : 'dark', true);
      }

      /* ============================================================
         Copy
         ============================================================ */
      function indicateCopied() {
        copyBtn.classList.add('is-copied');
        copyBtn.setAttribute('aria-label', 'Copied');
        copyBtn.title = 'Copied';
        copyStatus.textContent = 'Result copied to clipboard';

        window.clearTimeout(copiedTimer);
        copiedTimer = window.setTimeout(() => {
          copyBtn.classList.remove('is-copied');
          copyBtn.setAttribute('aria-label', 'Copy result');
          copyBtn.title = 'Copy result';
          copyStatus.textContent = '';
        }, COPY_FEEDBACK_MS);
      }

      async function copyResult() {
        if (state.error) return;

        let text;
        if (state.justEvaluated && state.resultValue !== null) {
          text = toPlainString(state.resultValue);
        } else if (state.expr) {
          text = state.expr;
        } else {
          text = '0';
        }

        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
          } else {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.setAttribute('readonly', '');
            ta.style.position = 'fixed';
            ta.style.top = '-1000px';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            const ok = document.execCommand('copy');
            ta.remove();
            if (!ok) throw new Error('Copy failed');
          }
          indicateCopied();
        } catch {
          copyStatus.textContent = 'Copy failed';
        }
      }

      /* ============================================================
         Events
         ============================================================ */
      keypad.addEventListener('click', (event) => {
        const button = event.target.closest('button[data-action]');
        if (!button) return;

        haptic();

        switch (button.dataset.action) {
          case 'digit':
            inputDigit(button.dataset.digit);
            break;
          case 'operator':
            inputOperator(button.dataset.operator);
            break;
          case 'equals':
            equals();
            break;
          case 'clear':
            clearAll();
            break;
          case 'delete':
            backspace();
            break;
          case 'percent':
            percent();
            break;
          case 'sign':
            toggleSign();
            break;
          default:
            break;
        }
      });

      // Scientific panel has its own delegated listener so actions stay scoped.
      sciPanel.addEventListener('click', (event) => {
        const button = event.target.closest('button[data-action]');
        if (!button) return;

        haptic();

        switch (button.dataset.action) {
          case 'func': {
            const name = state.second && button.dataset.altFunc
              ? button.dataset.altFunc
              : button.dataset.func;
            inputFunction(name);
            break;
          }
          case 'constant':
            inputConstant(button.dataset.constant);
            break;
          case 'paren':
            if (button.dataset.paren === '(') inputParenLeft();
            else inputParenRight();
            break;
          case 'power':
            inputPower();
            break;
          case 'square':
            appendPower('2');
            break;
          case 'reciprocal':
            appendPower('(-1)');
            break;
          case 'factorial':
            inputFactorial();
            break;
          case 'memory':
            memoryAction(button.dataset.mem);
            break;
          case 'angle':
            toggleAngleMode();
            break;
          default:
            break;
        }
      });

      modeButtons.forEach((btn) => {
        btn.addEventListener('click', () => setMode(btn.dataset.mode));
      });

      secondBtn.addEventListener('click', () => setSecond(!state.second));
      themeBtn.addEventListener('click', toggleTheme);
      copyBtn.addEventListener('click', copyResult);
      historyBtn.addEventListener('click', openHistory);
      closeHistoryBtn.addEventListener('click', closeHistory);
      clearHistoryBtn.addEventListener('click', clearHistory);

      historyList.addEventListener('click', (event) => {
        const button = event.target.closest('.history-entry[data-index]');
        if (!button || !historyList.contains(button)) return;
        useHistoryEntry(Number(button.dataset.index));
      });

      // Blur mouse-activated buttons so global keyboard shortcuts keep working.
      document.addEventListener('pointerup', (event) => {
        if (event.pointerType !== 'mouse') return;
        const target = event.target;
        if (target instanceof Element) {
          const button = target.closest('button');
          if (button) button.blur();
        }
      });

      document.addEventListener('keydown', (event) => {
        if (event.defaultPrevented) return;
        if (event.altKey || event.ctrlKey || event.metaKey) return;

        const key = event.key;

        // While the history drawer is open, only Escape is handled globally.
        if (historyOpen) {
          if (key === 'Escape') {
            event.preventDefault();
            closeHistory();
          }
          return;
        }

        const target = event.target;

        if (
          target instanceof Element &&
          target.closest('button') &&
          (key === 'Enter' || key === ' ')
        ) {
          return;
        }

        if (key >= '0' && key <= '9') {
          event.preventDefault();
          inputDigit(key);
          return;
        }

        if (key === '.' || key === ',') {
          event.preventDefault();
          inputDigit('.');
          return;
        }

        const secondOr = (base, alt) => (state.second ? alt : base);

        switch (key) {
          case '+':
            event.preventDefault();
            inputOperator('+');
            break;
          case '-':
            event.preventDefault();
            inputOperator('-');
            break;
          case '*':
          case 'x':
          case 'X':
            event.preventDefault();
            inputOperator('*');
            break;
          case '/':
            event.preventDefault();
            inputOperator('/');
            break;
          case '^':
            event.preventDefault();
            inputPower();
            break;
          case '!':
            event.preventDefault();
            inputFactorial();
            break;
          case '(':
            event.preventDefault();
            inputParenLeft();
            break;
          case ')':
            event.preventDefault();
            inputParenRight();
            break;
          case 'Enter':
          case '=':
            event.preventDefault();
            equals();
            break;
          case 'Backspace':
            event.preventDefault();
            backspace();
            break;
          case 'Delete':
          case 'Escape':
            event.preventDefault();
            clearAll();
            break;
          case '%':
            event.preventDefault();
            percent();
            break;
          case 'c':
          case 'C':
            event.preventDefault();
            clearAll();
            break;
          case 'h':
          case 'H':
            event.preventDefault();
            openHistory();
            break;
          case 's':
          case 'S':
            event.preventDefault();
            inputFunction(secondOr('sin', 'asin'));
            break;
          case 'o':
          case 'O':
            event.preventDefault();
            inputFunction(secondOr('cos', 'acos'));
            break;
          case 't':
          case 'T':
            event.preventDefault();
            inputFunction(secondOr('tan', 'atan'));
            break;
          case 'r':
          case 'R':
            event.preventDefault();
            inputFunction('sqrt');
            break;
          case 'l':
          case 'L':
            event.preventDefault();
            inputFunction(secondOr('log', 'pow10'));
            break;
          case 'n':
          case 'N':
            event.preventDefault();
            inputFunction(secondOr('ln', 'exp'));
            break;
          case 'p':
          case 'P':
            event.preventDefault();
            inputConstant('π');
            break;
          default:
            break;
        }
      });

      /* ============================================================
         Init
         ============================================================ */
      const saved = loadSettings();

      applyTheme(
        document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light',
        false
      );

      setAngleMode(saved.angleMode === 'RAD' ? 'RAD' : 'DEG');
      setSecond(saved.second === true);
      setMode(saved.mode === 'scientific' ? 'scientific' : 'basic');

      renderHistory();
      render();
    })();
  </script>
</body>
</html>
