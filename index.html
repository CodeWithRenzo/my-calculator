<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#e8eaee">
  <title>Calibre — Calculator</title>
  <style>
    /* ============================================================
       Design tokens
       ============================================================ */
    :root {
      color-scheme: light;

      --bg: #e8eaee;
      --surface: #ffffff;
      --surface-2: #f3f4f7;
      --surface-3: #e9ecf1;
      --display-bg: #f7f8fa;

      --text: #17191f;
      --text-muted: #646c7a;
      --text-subtle: #949ba7;

      --border: #e1e4e9;
      --border-strong: #d3d7df;

      --accent: #2f5bd7;
      --accent-strong: #2447a8;
      --accent-soft: #eef3ff;
      --accent-soft-hover: #e3ebff;

      --danger: #b42318;
      --danger-soft: #fff1f0;
      --danger-soft-hover: #ffe4e1;

      --radius-xl: 24px;
      --radius-lg: 16px;
      --radius-md: 13px;
      --radius-sm: 11px;

      --shadow: 0 1px 2px rgba(23, 25, 31, 0.04),
                0 24px 64px -20px rgba(23, 25, 31, 0.24);

      /* ~1s intentional mode transition */
      --mode-duration: 900ms;
      --mode-ease: cubic-bezier(0.22, 1, 0.36, 1);

      /* Snappier drawer transition */
      --drawer-duration: 380ms;
      --drawer-ease: cubic-bezier(0.22, 1, 0.36, 1);

      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif;
    }

    /* ============================================================
       Base
       ============================================================ */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      overflow-x: hidden;
      overflow-y: auto;
      padding:
        max(clamp(16px, 5vw, 48px), env(safe-area-inset-top))
        max(clamp(16px, 5vw, 48px), env(safe-area-inset-right))
        max(clamp(16px, 5vw, 48px), env(safe-area-inset-bottom))
        max(clamp(16px, 5vw, 48px), env(safe-area-inset-left));
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button {
      font-family: inherit;
    }

    /* ============================================================
       App shell
       ============================================================ */
    .calculator {
      position: relative;
      margin: auto;
      width: min(100%, 420px);
      display: flex;
      flex-direction: column;
      gap: clamp(12px, 3vw, 18px);
      padding: clamp(16px, 4vw, 24px);
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
    }

    /* ============================================================
       Header
       ============================================================ */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 2px 2px 0;
    }

    .brand {
      display: flex;
      align-items: baseline;
      min-width: 0;
    }

    .brand h1 {
      margin: 0;
      color: var(--text);
      font-size: 0.94rem;
      font-weight: 650;
      letter-spacing: 0.09em;
      line-height: 1;
      text-transform: uppercase;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ---- Mode toggle ---- */
    .mode-toggle {
      display: inline-flex;
      padding: 2px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .mode-btn {
      padding: 4px 10px;
      font-size: 0.7rem;
      font-weight: 560;
      letter-spacing: 0.02em;
      color: var(--text-muted);
      background: transparent;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      line-height: 1.3;
      transition:
        background-color 160ms ease,
        color 160ms ease,
        box-shadow 160ms ease;
    }

    .mode-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .mode-btn.is-active {
      color: var(--text);
      background: var(--surface);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
    }

    @media (hover: hover) {
      .mode-btn:not(.is-active):hover {
        color: var(--text);
      }
    }

    /* ---- Icon buttons ---- */
    .icon-button {
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      padding: 0;
      color: var(--text-muted);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 10px;
      cursor: pointer;
      transition:
        background-color 140ms ease,
        border-color 140ms ease,
        color 140ms ease,
        transform 80ms ease;
    }

    .icon-button svg {
      width: 17px;
      height: 17px;
    }

    .icon-button:active {
      transform: translateY(1px);
    }

    .icon-button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .icon-button:disabled {
      cursor: not-allowed;
      opacity: 0.38;
    }

    .icon-button.is-copied {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .icon-check { display: none; }
    .icon-button.is-copied .icon-copy { display: none; }
    .icon-button.is-copied .icon-check { display: block; }

    /* ============================================================
       Display
       ============================================================ */
    .display {
      min-height: 132px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 6px;
      padding: clamp(14px, 4vw, 20px);
      background: var(--display-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: min-height var(--mode-duration) var(--mode-ease);
    }

    .calculator.scientific .display {
      min-height: 112px;
    }

    .expression {
      min-height: 18px;
      margin: 0;
      overflow: hidden;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-variant-numeric: tabular-nums;
      font-weight: 500;
      letter-spacing: 0.01em;
      line-height: 1.3;
      text-align: right;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .result {
      display: block;
      min-height: 1.1em;
      margin: 0;
      overflow: hidden;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      font-weight: 620;
      letter-spacing: -0.04em;
      line-height: 1.05;
      text-align: right;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: color 140ms ease;
    }

    .result[data-size="lg"] { font-size: clamp(2.4rem, 10vw, 3.5rem); }
    .result[data-size="md"] { font-size: clamp(1.9rem, 8vw, 2.8rem); }
    .result[data-size="sm"] { font-size: clamp(1.5rem, 6.5vw, 2.2rem); }
    .result[data-size="xs"] { font-size: clamp(1.15rem, 5vw, 1.7rem); }
    .result[data-size="xxs"] { font-size: clamp(0.95rem, 4vw, 1.35rem); }

    .result.is-error {
      color: var(--danger);
      font-size: clamp(1.8rem, 8vw, 2.8rem);
    }

    /* ============================================================
       Keypad area (sci panel + standard keypad)
       ============================================================ */
    .keypad-area {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* ---- Collapsible scientific panel ---- */
    .sci-panel {
      display: grid;
      grid-template-rows: 0fr;
      min-height: 0;
      overflow: hidden;
      opacity: 0;
      transition:
        grid-template-rows var(--mode-duration) var(--mode-ease),
        opacity 400ms ease;
    }

    .calculator.scientific .sci-panel {
      grid-template-rows: 1fr;
      opacity: 1;
    }

    .sci-panel > .sci-grid {
      min-height: 0;
      overflow: hidden;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(6px, 1.8vw, 10px);
      padding-bottom: clamp(10px, 2.4vw, 14px);
    }

    /* ---- Standard keypad ---- */
    .keypad {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(8px, 2.2vw, 12px);
    }

    /* ============================================================
       Keys
       ============================================================ */
    .key {
      min-height: clamp(52px, 12vw, 64px);
      display: grid;
      place-items: center;
      padding: 0;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: clamp(1.1rem, 4.5vw, 1.35rem);
      font-weight: 520;
      line-height: 1;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition:
        background-color 120ms ease,
        border-color 120ms ease,
        color 120ms ease,
        box-shadow 120ms ease,
        transform 80ms ease;
    }

    .key:active { transform: translateY(1px); }

    .key:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* ---- Variants ---- */
    .key--utility {
      color: var(--text-muted);
      background: var(--surface-3);
      font-size: clamp(0.95rem, 3.8vw, 1.08rem);
      font-weight: 580;
    }

    .key--operator {
      color: var(--accent);
      background: var(--accent-soft);
      font-size: clamp(1.25rem, 5vw, 1.55rem);
      font-weight: 560;
    }

    .key--operator[aria-pressed="true"] {
      color: #ffffff;
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 2px 8px rgba(47, 91, 215, 0.22);
    }

    .key--danger {
      color: var(--danger);
      background: var(--danger-soft);
      font-size: clamp(0.9rem, 3.6vw, 1.02rem);
      font-weight: 650;
    }

    .key--equals {
      color: #ffffff;
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 8px 18px -10px rgba(47, 91, 215, 0.6);
      font-size: clamp(1.35rem, 5vw, 1.65rem);
      font-weight: 600;
    }

    .key--equals:active {
      background: var(--accent-strong);
      border-color: var(--accent-strong);
    }

    /* ---- Scientific function keys ---- */
    .key--function {
      color: var(--text-muted);
      background: var(--surface-2);
      font-size: clamp(0.78rem, 3vw, 0.9rem);
      font-weight: 540;
      letter-spacing: 0.01em;
    }

    .key--function[data-func="sqrt"] {
      font-size: clamp(1rem, 4vw, 1.15rem);
    }

    .key--toggle {
      color: var(--accent);
      background: var(--accent-soft);
      font-size: clamp(0.62rem, 2.4vw, 0.7rem);
      font-weight: 680;
      letter-spacing: 0.08em;
    }

    /* ---- Hover states ---- */
    @media (hover: hover) {
      .icon-button:hover {
        color: var(--text);
        background: var(--surface-2);
      }
      .icon-button.is-copied:hover {
        color: var(--accent);
        background: var(--accent-soft-hover);
      }
      .key:hover {
        background: #eef0f4;
        border-color: var(--border);
      }
      .key--utility:hover {
        color: var(--text);
        background: #e3e6ec;
      }
      .key--operator:hover {
        background: var(--accent-soft-hover);
      }
      .key--operator[aria-pressed="true"]:hover {
        background: var(--accent-strong);
        border-color: var(--accent-strong);
      }
      .key--danger:hover {
        color: var(--danger);
        background: var(--danger-soft-hover);
      }
      .key--equals:hover {
        background: var(--accent-strong);
        border-color: var(--accent-strong);
      }
      .key--function:hover {
        color: var(--text);
        background: #eceef3;
        border-color: var(--border);
      }
      .key--toggle:hover {
        color: var(--accent-strong);
        background: var(--accent-soft-hover);
      }
    }

    /* ============================================================
       History drawer
       ============================================================ */
    .history-panel {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-radius: var(--radius-xl);
      transform: translateX(100%);
      transition: transform var(--drawer-duration) var(--drawer-ease);
      will-change: transform;
    }

    .history-panel.is-open {
      transform: translateX(0);
    }

    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: clamp(14px, 3.6vw, 20px) clamp(14px, 3.6vw, 20px);
      border-bottom: 1px solid var(--border);
      flex: 0 0 auto;
    }

    .history-header h2 {
      margin: 0;
      font-size: 0.94rem;
      font-weight: 650;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--text);
    }

    .history-header-actions {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .text-button {
      padding: 6px 10px;
      font-size: 0.78rem;
      font-weight: 560;
      color: var(--danger);
      background: transparent;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 140ms ease, opacity 140ms ease;
    }

    .text-button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .text-button:disabled {
      color: var(--text-subtle);
      cursor: not-allowed;
      opacity: 0.55;
    }

    @media (hover: hover) {
      .text-button:not(:disabled):hover {
        background: var(--danger-soft);
      }
    }

    .history-list {
      flex: 1 1 auto;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: clamp(8px, 2vw, 12px);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .history-entry {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      padding: 12px 14px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      text-align: right;
      cursor: pointer;
      transition:
        background-color 140ms ease,
        border-color 140ms ease;
    }

    .history-entry:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    .history-entry:active {
      background: var(--surface-3);
    }

    @media (hover: hover) {
      .history-entry:hover {
        background: var(--surface-2);
        border-color: var(--border);
      }
    }

    .history-expr {
      max-width: 100%;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-result {
      max-width: 100%;
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 40px 24px;
      color: var(--text-subtle);
      font-size: 0.85rem;
      text-align: center;
      line-height: 1.4;
    }

    .history-empty[hidden] {
      display: none;
    }

    /* ============================================================
       Utilities & responsive refinements
       ============================================================ */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 360px) {
      .calculator {
        gap: 10px;
        padding: 13px;
      }
      .display { min-height: 104px; }
      .calculator.scientific .display { min-height: 96px; }
      .keypad { gap: 7px; }
      .sci-panel > .sci-grid { gap: 6px; padding-bottom: 9px; }
      .key {
        min-height: 48px;
        border-radius: 10px;
      }
      .brand h1 { font-size: 0.85rem; }
      .mode-btn { padding: 3px 8px; font-size: 0.65rem; }
      .icon-button { width: 30px; height: 30px; }
      .header-actions { gap: 3px; }
      .history-result { font-size: 1.15rem; }
    }

    @media (max-height: 760px) {
      body {
        padding-top: 10px;
        padding-bottom: 10px;
      }
      .calculator {
        gap: 10px;
        padding: 14px;
      }
      .display { min-height: 104px; padding: 12px 16px; }
      .calculator.scientific .display { min-height: 92px; }
      .key { min-height: 46px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        transition-delay: 0ms !important;
        animation-duration: 0.01ms !important;
        animation-delay: 0ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main class="calculator" id="calculator" aria-labelledby="app-title">
    <header class="app-header" id="appHeader">
      <div class="brand">
        <h1 id="app-title">Calibre</h1>
      </div>

      <div class="header-actions">
        <button
          id="historyBtn"
          class="icon-button"
          type="button"
          aria-label="Open calculation history"
          title="History"
        >
          <svg
            aria-hidden="true"
            focusable="false"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
            <path d="M12 7v5l4 2"></path>
          </svg>
        </button>

        <div class="mode-toggle" role="group" aria-label="Calculator mode">
          <button type="button" class="mode-btn is-active" data-mode="basic" aria-pressed="true">Basic</button>
          <button type="button" class="mode-btn" data-mode="scientific" aria-pressed="false">Sci</button>
        </div>

        <button id="copyBtn" class="icon-button" type="button" aria-label="Copy result" title="Copy result">
          <svg class="icon-copy" aria-hidden="true" focusable="false" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <svg class="icon-check" aria-hidden="true" focusable="false" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 6 9 17l-5-5"></path>
          </svg>
        </button>
      </div>
    </header>

    <section class="display" id="displaySection" aria-label="Calculator display">
      <p class="expression" id="expression" aria-hidden="true"></p>
      <output class="result" id="result" aria-live="polite" aria-atomic="true">0</output>
    </section>

    <div class="keypad-area" id="keypadArea">
      <!-- Collapsible scientific panel -->
      <div class="sci-panel" id="sciPanel">
        <div class="sci-grid">
          <button class="key key--function" type="button" data-action="func" data-func="sin" aria-label="Sine">sin</button>
          <button class="key key--function" type="button" data-action="func" data-func="cos" aria-label="Cosine">cos</button>
          <button class="key key--function" type="button" data-action="func" data-func="tan" aria-label="Tangent">tan</button>
          <button class="key key--function key--toggle" type="button" data-action="angle" aria-label="Angle mode: DEG. Click to toggle.">DEG</button>

          <button class="key key--function" type="button" data-action="func" data-func="log" aria-label="Log base 10">log</button>
          <button class="key key--function" type="button" data-action="func" data-func="ln" aria-label="Natural logarithm">ln</button>
          <button class="key key--function" type="button" data-action="func" data-func="sqrt" aria-label="Square root">√</button>
          <button class="key key--function" type="button" data-action="power" aria-label="Power, x to the y">xʸ</button>

          <button class="key key--function" type="button" data-action="paren" data-paren="(" aria-label="Open parenthesis">(</button>
          <button class="key key--function" type="button" data-action="paren" data-paren=")" aria-label="Close parenthesis">)</button>
          <button class="key key--function" type="button" data-action="constant" data-constant="π" aria-label="Pi">π</button>
          <button class="key key--function" type="button" data-action="constant" data-constant="e" aria-label="Euler's number">e</button>
        </div>
      </div>

      <!-- Standard keypad -->
      <div class="keypad" id="keypad">
        <button class="key key--danger" type="button" data-action="clear" aria-label="All clear">AC</button>
        <button class="key key--utility" type="button" data-action="delete" aria-label="Delete last character">DEL</button>
        <button class="key key--utility" type="button" data-action="percent" aria-label="Percent">%</button>
        <button class="key key--operator" type="button" data-action="operator" data-operator="/" aria-label="Divide" aria-pressed="false">÷</button>

        <button class="key" type="button" data-action="digit" data-digit="7">7</button>
        <button class="key" type="button" data-action="digit" data-digit="8">8</button>
        <button class="key" type="button" data-action="digit" data-digit="9">9</button>
        <button class="key key--operator" type="button" data-action="operator" data-operator="*" aria-label="Multiply" aria-pressed="false">×</button>

        <button class="key" type="button" data-action="digit" data-digit="4">4</button>
        <button class="key" type="button" data-action="digit" data-digit="5">5</button>
        <button class="key" type="button" data-action="digit" data-digit="6">6</button>
        <button class="key key--operator" type="button" data-action="operator" data-operator="-" aria-label="Subtract" aria-pressed="false">−</button>

        <button class="key" type="button" data-action="digit" data-digit="1">1</button>
        <button class="key" type="button" data-action="digit" data-digit="2">2</button>
        <button class="key" type="button" data-action="digit" data-digit="3">3</button>
        <button class="key key--operator" type="button" data-action="operator" data-operator="+" aria-label="Add" aria-pressed="false">+</button>

        <button class="key key--utility" type="button" data-action="sign" aria-label="Toggle sign">±</button>
        <button class="key" type="button" data-action="digit" data-digit="0">0</button>
        <button class="key" type="button" data-action="digit" data-digit="." aria-label="Decimal point">.</button>
        <button class="key key--equals" type="button" data-action="equals" aria-label="Equals">=</button>
      </div>
    </div>

    <!-- History drawer -->
    <div class="history-panel" id="historyPanel" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="historyTitle">
      <header class="history-header">
        <h2 id="historyTitle">History</h2>
        <div class="history-header-actions">
          <button id="clearHistoryBtn" class="text-button" type="button" aria-label="Clear all history" disabled>Clear</button>
          <button id="closeHistoryBtn" class="icon-button" type="button" aria-label="Close history" title="Close">
            <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 6 6 18"></path>
              <path d="m6 6 12 12"></path>
            </svg>
          </button>
        </div>
      </header>

      <div class="history-list" id="historyList" role="list"></div>
      <p class="history-empty" id="historyEmpty">No calculations yet.<br>Your history will appear here.</p>
    </div>

    <span class="sr-only" id="copyStatus" aria-live="polite"></span>
  </main>

  <script>
    (() => {
      'use strict';

      /* ============================================================
         Element references
         ============================================================ */
      const calculator = document.getElementById('calculator');
      const appHeader = document.getElementById('appHeader');
      const displaySection = document.getElementById('displaySection');
      const keypadArea = document.getElementById('keypadArea');
      const resultEl = document.getElementById('result');
      const expressionEl = document.getElementById('expression');
      const keypad = document.getElementById('keypad');
      const sciPanel = document.getElementById('sciPanel');
      const copyBtn = document.getElementById('copyBtn');
      const copyStatus = document.getElementById('copyStatus');
      const modeButtons = Array.from(document.querySelectorAll('.mode-btn'));
      const operatorButtons = Array.from(
        document.querySelectorAll('[data-action="operator"]')
      );
      const angleButton = document.querySelector('[data-action="angle"]');

      const historyBtn = document.getElementById('historyBtn');
      const historyPanel = document.getElementById('historyPanel');
      const historyList = document.getElementById('historyList');
      const historyEmpty = document.getElementById('historyEmpty');
      const clearHistoryBtn = document.getElementById('clearHistoryBtn');
      const closeHistoryBtn = document.getElementById('closeHistoryBtn');

      /* ============================================================
         Constants
         ============================================================ */
      const MAX_INPUT_DIGITS = 15;
      const PRECISION = 12;
      const COPY_FEEDBACK_MS = 1400;
      const HISTORY_KEY = 'calibre-history-v1';
      const MAX_HISTORY = 30;

      const FUNC_PREFIXES = ['sqrt', 'sin', 'cos', 'tan', 'log', 'ln'];

      const DISPLAY_SYMBOLS = Object.freeze({
        '+': '+', '-': '−', '*': '×', '/': '÷', '^': '^'
      });

      /* ============================================================
         Calculator state
         ============================================================ */
      const state = {
        expr: '',
        resultValue: null,
        resultStr: '',
        lastExpression: '',
        error: null,
        justEvaluated: false,
        angleMode: 'DEG',
        mode: 'basic'
      };

      let copiedTimer = null;
      let historyOpen = false;
      let historyTrigger = null;

      /* ============================================================
         History persistence
         ============================================================ */
      let historyEntries = loadHistory();

      function loadHistory() {
        try {
          const raw = localStorage.getItem(HISTORY_KEY);
          if (!raw) return [];
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) return [];
          return parsed
            .filter(
              (entry) =>
                entry &&
                typeof entry.expr === 'string' &&
                typeof entry.result === 'string' &&
                typeof entry.value === 'number' &&
                Number.isFinite(entry.value)
            )
            .slice(0, MAX_HISTORY);
        } catch {
          return [];
        }
      }

      function saveHistory() {
        try {
          localStorage.setItem(HISTORY_KEY, JSON.stringify(historyEntries));
        } catch {
          // Storage unavailable; history is session-only.
        }
      }

      function addToHistory(expr, result, value) {
        historyEntries.unshift({ expr, result, value });
        if (historyEntries.length > MAX_HISTORY) {
          historyEntries.length = MAX_HISTORY;
        }
        saveHistory();
        renderHistory();
      }

      function renderHistory() {
        historyList.innerHTML = '';
        clearHistoryBtn.disabled = historyEntries.length === 0;

        if (historyEntries.length === 0) {
          historyEmpty.hidden = false;
          return;
        }

        historyEmpty.hidden = true;

        for (let i = 0; i < historyEntries.length; i++) {
          const entry = historyEntries[i];
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'history-entry';
          btn.setAttribute('role', 'listitem');
          btn.setAttribute(
            'aria-label',
            `Use result ${entry.result}, from ${entry.expr}`
          );

          const exprSpan = document.createElement('span');
          exprSpan.className = 'history-expr';
          exprSpan.textContent = entry.expr;

          const resultSpan = document.createElement('span');
          resultSpan.className = 'history-result';
          resultSpan.textContent = entry.result;

          btn.appendChild(exprSpan);
          btn.appendChild(resultSpan);
          btn.addEventListener('click', () => useHistoryEntry(i));
          historyList.appendChild(btn);
        }
      }

      function useHistoryEntry(idx) {
        const entry = historyEntries[idx];
        if (!entry) return;

        state.expr = String(entry.value);
        state.resultValue = entry.value;
        state.resultStr = entry.result;
        state.lastExpression = entry.expr + ' =';
        state.justEvaluated = true;
        state.error = null;

        closeHistory();
        render();
      }

      function clearHistory() {
        historyEntries = [];
        saveHistory();
        renderHistory();
      }

      /* ============================================================
         History drawer open/close
         ============================================================ */
      function openHistory() {
        if (historyOpen) return;
        historyOpen = true;
        historyTrigger = document.activeElement;

        renderHistory();
        historyPanel.classList.add('is-open');
        historyPanel.setAttribute('aria-hidden', 'false');

        appHeader.inert = true;
        displaySection.inert = true;
        keypadArea.inert = true;

        // Focus the close button after the panel begins its transition.
        closeHistoryBtn.focus({ preventScroll: true });
      }

      function closeHistory() {
        if (!historyOpen) return;
        historyOpen = false;

        historyPanel.classList.remove('is-open');
        historyPanel.setAttribute('aria-hidden', 'true');

        appHeader.inert = false;
        displaySection.inert = false;
        keypadArea.inert = false;

        const target =
          historyTrigger && document.contains(historyTrigger)
            ? historyTrigger
            : historyBtn;

        // Return focus to the trigger.
        requestAnimationFrame(() => {
          try {
            target.focus({ preventScroll: true });
          } catch {
            historyBtn.focus({ preventScroll: true });
          }
        });
      }

      // Trap Tab focus within the panel while it is open.
      historyPanel.addEventListener('keydown', (event) => {
        if (event.key !== 'Tab') return;

        const focusable = historyPanel.querySelectorAll(
          'button:not([disabled]), [href], input:not([disabled]), select, textarea, [tabindex]:not([tabindex="-1"])'
        );
        if (focusable.length === 0) return;

        const first = focusable[0];
        const last = focusable[focusable.length - 1];

        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      });

      /* ============================================================
         Number formatting
         ============================================================ */
      function formatNumberForDisplay(value) {
        if (!Number.isFinite(value)) return 'Error';
        if (Object.is(value, -0)) value = 0;

        const rounded = Number(value.toPrecision(PRECISION));
        if (!Number.isFinite(rounded)) return 'Error';

        const abs = Math.abs(rounded);
        if (abs !== 0 && (abs >= 1e12 || abs < 1e-9)) {
          return rounded
            .toExponential(6)
            .replace(/\.?0+e/, 'e')
            .replace('e+', 'e');
        }

        const str = String(rounded);
        if (/[eE]/.test(str)) return str;

        let sign = '';
        let unsigned = str;
        if (unsigned.startsWith('-')) {
          sign = '-';
          unsigned = unsigned.slice(1);
        }

        const [intPart, decPart] = unsigned.split('.');
        const grouped = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        return sign + grouped + (decPart !== undefined ? '.' + decPart : '');
      }

      function getDisplaySize(text) {
        const len = text.length;
        if (len > 30) return 'xxs';
        if (len > 22) return 'xs';
        if (len > 15) return 'sm';
        if (len > 9) return 'md';
        return 'lg';
      }

      /* ============================================================
         Expression display formatter
         ============================================================ */
      function formatExpression(expr) {
        if (!expr) return '';
        let out = '';
        let i = 0;
        let prevType = null;

        while (i < expr.length) {
          const ch = expr[i];

          if (/[\d.]/.test(ch)) {
            let num = '';
            while (i < expr.length && /[\d.]/.test(expr[i])) num += expr[i++];
            out += num;
            prevType = 'number';
            continue;
          }

          if (ch === 'π' || ch === 'e') {
            out += ch;
            i++;
            prevType = 'const';
            continue;
          }

          if (ch === '(') {
            out += '(';
            i++;
            prevType = 'lparen';
            continue;
          }

          if (ch === ')') {
            out += ')';
            i++;
            prevType = 'rparen';
            continue;
          }

          if ('+-*/^'.includes(ch)) {
            const isUnary =
              prevType === null ||
              prevType === 'op' ||
              prevType === 'lparen' ||
              prevType === 'func';

            const sym = DISPLAY_SYMBOLS[ch];
            out += isUnary ? sym : ' ' + sym + ' ';
            i++;
            prevType = 'op';
            continue;
          }

          let matched = false;
          for (const fn of FUNC_PREFIXES) {
            if (expr.startsWith(fn, i)) {
              out += fn === 'sqrt' ? '√' : fn;
              i += fn.length;
              prevType = 'func';
              matched = true;
              break;
            }
          }
          if (!matched) i++;
        }

        return out.trim();
      }

      /* ============================================================
         Tokenizer (supports scientific notation)
         ============================================================ */
      function tokenize(str) {
        const tokens = [];
        let i = 0;

        while (i < str.length) {
          const ch = str[i];

          if (ch === ' ') { i++; continue; }

          if (/[0-9.]/.test(ch)) {
            let num = '';
            while (i < str.length && /[0-9.]/.test(str[i])) num += str[i++];

            // Scientific notation: <digits>[eE][+-]?<digits>
            if (i < str.length && (str[i] === 'e' || str[i] === 'E')) {
              const next = str[i + 1];
              const nextNext = str[i + 2];
              if ((next === '+' || next === '-') && /[0-9]/.test(nextNext)) {
                num += str[i++];
                num += str[i++];
                while (i < str.length && /[0-9]/.test(str[i])) num += str[i++];
              } else if (/[0-9]/.test(next)) {
                num += str[i++];
                while (i < str.length && /[0-9]/.test(str[i])) num += str[i++];
              }
            }

            const value = parseFloat(num);
            if (!Number.isFinite(value)) throw new Error('Invalid number');
            tokens.push({ type: 'number', value });
            continue;
          }

          if ('+-*/^'.includes(ch)) {
            tokens.push({ type: 'op', value: ch });
            i++;
            continue;
          }

          if (ch === '(') { tokens.push({ type: 'lparen' }); i++; continue; }
          if (ch === ')') { tokens.push({ type: 'rparen' }); i++; continue; }
          if (ch === 'π') { tokens.push({ type: 'number', value: Math.PI }); i++; continue; }
          if (ch === 'e') { tokens.push({ type: 'number', value: Math.E }); i++; continue; }

          let matched = false;
          for (const fn of FUNC_PREFIXES) {
            if (str.startsWith(fn, i)) {
              tokens.push({ type: 'func', value: fn });
              i += fn.length;
              matched = true;
              break;
            }
          }
          if (matched) continue;

          throw new Error('Invalid character');
        }

        return resolveUnary(tokens);
      }

      function resolveUnary(tokens) {
        const result = [];
        for (const t of tokens) {
          if (t.type === 'op' && (t.value === '-' || t.value === '+')) {
            const prev = result[result.length - 1];
            const isUnary =
              !prev ||
              prev.type === 'op' ||
              prev.type === 'lparen' ||
              prev.type === 'func';

            if (isUnary) {
              if (t.value === '-') result.push({ type: 'unary', value: 'neg' });
              continue;
            }
          }
          result.push(t);
        }
        return result;
      }

      /* ============================================================
         Shunting-yard → RPN
         ============================================================ */
      function toRPN(tokens) {
        const output = [];
        const stack = [];

        const prec = { '+': 1, '-': 1, '*': 2, '/': 2, 'neg': 3, '^': 4 };
        const rightAssoc = { '^': true, 'neg': true };

        for (const t of tokens) {
          if (t.type === 'number') {
            output.push(t);
          } else if (t.type === 'func') {
            stack.push(t);
          } else if (t.type === 'op' || t.type === 'unary') {
            const op = t.type === 'unary' ? 'neg' : t.value;

            while (stack.length > 0) {
              const top = stack[stack.length - 1];

              if (top.type === 'func') {
                output.push(stack.pop());
                continue;
              }

              if (top.type === 'op' || top.type === 'unary') {
                const topOp = top.type === 'unary' ? 'neg' : top.value;
                const shouldPop = rightAssoc[op]
                  ? prec[topOp] > prec[op]
                  : prec[topOp] >= prec[op];

                if (shouldPop) {
                  output.push(stack.pop());
                  continue;
                }
              }
              break;
            }

            stack.push(t);
          } else if (t.type === 'lparen') {
            stack.push(t);
          } else if (t.type === 'rparen') {
            while (stack.length > 0 && stack[stack.length - 1].type !== 'lparen') {
              output.push(stack.pop());
            }
            if (stack.length === 0) throw new Error('Mismatched parentheses');
            stack.pop();
            if (stack.length > 0 && stack[stack.length - 1].type === 'func') {
              output.push(stack.pop());
            }
          }
        }

        while (stack.length > 0) {
          const t = stack.pop();
          if (t.type === 'lparen') throw new Error('Mismatched parentheses');
          output.push(t);
        }

        return output;
      }

      /* ============================================================
         RPN evaluator
         ============================================================ */
      function evalRPN(rpn, angleMode) {
        const stack = [];
        const toRad = angleMode === 'DEG' ? Math.PI / 180 : 1;

        for (const t of rpn) {
          if (t.type === 'number') {
            stack.push(t.value);
            continue;
          }

          if (t.type === 'func') {
            const x = stack.pop();
            if (x === undefined) throw new Error('Invalid expression');

            let result;
            switch (t.value) {
              case 'sin': result = Math.sin(x * toRad); break;
              case 'cos': result = Math.cos(x * toRad); break;
              case 'tan': {
                const rad = x * toRad;
                const c = Math.cos(rad);
                if (Math.abs(c) < 1e-14) throw new Error('Undefined');
                result = Math.sin(rad) / c;
                break;
              }
              case 'log':
                if (x <= 0) throw new Error('Invalid input');
                result = Math.log10(x);
                break;
              case 'ln':
                if (x <= 0) throw new Error('Invalid input');
                result = Math.log(x);
                break;
              case 'sqrt':
                if (x < 0) throw new Error('Invalid input');
                result = Math.sqrt(x);
                break;
              default:
                throw new Error('Unknown function');
            }
            if (!Number.isFinite(result)) throw new Error('Invalid result');
            stack.push(result);
            continue;
          }

          if (t.type === 'unary' || t.type === 'op') {
            const op = t.type === 'unary' ? 'neg' : t.value;

            if (op === 'neg') {
              const x = stack.pop();
              if (x === undefined) throw new Error('Invalid expression');
              stack.push(-x);
              continue;
            }

            const b = stack.pop();
            const a = stack.pop();
            if (a === undefined || b === undefined) {
              throw new Error('Invalid expression');
            }

            let result;
            switch (op) {
              case '+': result = a + b; break;
              case '-': result = a - b; break;
              case '*': result = a * b; break;
              case '/':
                if (b === 0) throw new Error('Cannot divide by zero');
                result = a / b;
                break;
              case '^': result = Math.pow(a, b); break;
              default: throw new Error('Unknown operator');
            }

            if (!Number.isFinite(result)) throw new Error('Result is too large');
            stack.push(result);
          }
        }

        if (stack.length !== 1) throw new Error('Invalid expression');
        return stack[0];
      }

      /* ============================================================
         High-level evaluation
         ============================================================ */
      function evaluate(exprStr, angleMode) {
        return evalRPN(toRPN(tokenize(exprStr)), angleMode);
      }

      function autoClose(exprStr) {
        const open = (exprStr.match(/\(/g) || []).length;
        const close = (exprStr.match(/\)/g) || []).length;
        if (close > open) return null;
        return exprStr + ')'.repeat(open - close);
      }

      function computePreview() {
        if (!state.expr) return null;

        if (
          !/[+\-*/^()πe]/.test(state.expr) &&
          !/(sin|cos|tan|log|ln|sqrt)/.test(state.expr)
        ) {
          return null;
        }

        const full = autoClose(state.expr);
        if (full === null) return null;

        const stripped = full.replace(/\)+$/, '');
        const lastChar = stripped[stripped.length - 1];
        if ('+-*/^('.includes(lastChar)) return null;

        try {
          const value = evaluate(full, state.angleMode);
          if (!Number.isFinite(value)) return null;
          return formatNumberForDisplay(value);
        } catch {
          return null;
        }
      }

      /* ============================================================
         Input actions
         ============================================================ */
      function inputDigit(d) {
        ensureNoError();

        if (state.justEvaluated) {
          state.expr = '';
          state.resultValue = null;
          state.resultStr = '';
          state.lastExpression = '';
          state.justEvaluated = false;
        }

        const numberMatch = state.expr.match(/[\d.]+$/);

        if (numberMatch) {
          const num = numberMatch[0];

          if (d === '.') {
            if (num.includes('.')) return;
            state.expr += '.';
          } else {
            if (num === '0') {
              state.expr = state.expr.slice(0, -1) + d;
            } else {
              if (num.replace('.', '').length >= MAX_INPUT_DIGITS) return;
              state.expr += d;
            }
          }
        } else {
          const last = state.expr[state.expr.length - 1] || '';
          if (last === ')' || last === 'π' || last === 'e') {
            state.expr += '*';
          }
          state.expr += d === '.' ? '0.' : d;
        }

        render();
      }

      function inputOperator(op) {
        if (state.error) {
          resetState();
          render();
          return;
        }

        if (state.justEvaluated) {
          state.expr = String(state.resultValue);
          state.resultValue = null;
          state.resultStr = '';
          state.lastExpression = '';
          state.justEvaluated = false;
        }

        if (state.expr === '') {
          if (op === '-') state.expr = '-';
          render();
          return;
        }

        const last = state.expr[state.expr.length - 1];

        if (last === '(') {
          if (op === '-') state.expr += '-';
          render();
          return;
        }

        if ('+-*/^'.includes(last)) {
          const beforeLast = state.expr[state.expr.length - 2] || '';

          if (last === '-' && '+-*/^'.includes(beforeLast)) {
            state.expr =
              op === '-'
                ? state.expr.slice(0, -2) + '-'
                : state.expr.slice(0, -2) + op;
          } else if (op === '-' && last !== '-') {
            state.expr += '-';
          } else {
            state.expr = state.expr.slice(0, -1) + op;
          }
        } else {
          state.expr += op;
        }

        render();
      }

      function inputFunction(name) {
        ensureNoError();
        clearEvaluated();

        const last = state.expr[state.expr.length - 1] || '';
        if (last === ')' || last === 'π' || last === 'e' || /[\d.]/.test(last)) {
          state.expr += '*';
        }

        state.expr += name + '(';
        render();
      }

      function inputConstant(c) {
        ensureNoError();
        clearEvaluated();

        const last = state.expr[state.expr.length - 1] || '';
        if (last === ')' || last === 'π' || last === 'e' || /[\d.]/.test(last)) {
          state.expr += '*';
        }

        state.expr += c;
        render();
      }

      function inputParenLeft() {
        ensureNoError();
        clearEvaluated();

        const last = state.expr[state.expr.length - 1] || '';
        if (last === ')' || last === 'π' || last === 'e' || /[\d.]/.test(last)) {
          state.expr += '*';
        }

        state.expr += '(';
        render();
      }

      function inputParenRight() {
        if (state.error || state.justEvaluated || !state.expr) return;

        const last = state.expr[state.expr.length - 1];
        if ('+-*/^('.includes(last)) return;

        const open = (state.expr.match(/\(/g) || []).length;
        const close = (state.expr.match(/\)/g) || []).length;

        if (open > close) {
          state.expr += ')';
          render();
        }
      }

      function inputPower() {
        ensureNoError();

        if (state.justEvaluated) {
          state.expr = String(state.resultValue);
          state.resultValue = null;
          state.resultStr = '';
          state.lastExpression = '';
          state.justEvaluated = false;
        }

        if (!state.expr) return;

        const last = state.expr[state.expr.length - 1];
        if ('+-*/^('.includes(last)) return;

        state.expr += '^';
        render();
      }

      function equals() {
        if (state.error || state.justEvaluated || !state.expr) return;

        const stripped = state.expr.replace(/\)+$/, '');
        const lastChar = stripped[stripped.length - 1];
        if ('+-*/^('.includes(lastChar)) return;

        const full = autoClose(state.expr);
        if (full === null) {
          state.error = 'Mismatched parentheses';
          render();
          return;
        }

        try {
          const value = evaluate(full, state.angleMode);
          if (!Number.isFinite(value)) throw new Error('Invalid result');

          state.lastExpression = formatExpression(full) + ' =';
          state.expr = full;
          state.resultValue = value;
          state.resultStr = formatNumberForDisplay(value);
          state.justEvaluated = true;
          state.error = null;

          // Only add meaningful computations to history.
          const tokens = tokenize(full);
          if (tokens.length > 1) {
            addToHistory(formatExpression(full), state.resultStr, value);
          }
        } catch (err) {
          state.error = err.message || 'Invalid expression';
          state.resultValue = null;
          state.resultStr = '';
          state.lastExpression = '';
          state.justEvaluated = false;
        }

        render();
      }

      function clearAll() {
        resetState();
        render();
      }

      function backspace() {
        if (state.error) { clearAll(); return; }

        if (state.justEvaluated) {
          resetState();
          render();
          return;
        }

        if (!state.expr) return;

        for (const fn of [...FUNC_PREFIXES].sort((a, b) => b.length - a.length)) {
          if (state.expr.endsWith(fn + '(')) {
            state.expr = state.expr.slice(0, -(fn.length + 1));
            render();
            return;
          }
        }

        state.expr = state.expr.slice(0, -1);
        render();
      }

      function percent() {
        ensureNoError();

        if (state.justEvaluated) {
          state.expr = String(state.resultValue);
          state.resultValue = null;
          state.resultStr = '';
          state.lastExpression = '';
          state.justEvaluated = false;
        }

        if (!state.expr) return;

        const match = state.expr.match(/[\d.]+$/);
        if (!match) return;

        const numStr = match[0];
        const numValue = parseFloat(numStr);
        if (!Number.isFinite(numValue)) return;

        const before = state.expr.slice(0, state.expr.length - numStr.length);
        const opMatch = before.match(/([+\-*/^(])$/);

        let newValue = numValue / 100;

        if (opMatch && (opMatch[1] === '+' || opMatch[1] === '-')) {
          try {
            const leftExpr = before.slice(0, -1);
            if (leftExpr) {
              const leftValue = evaluate(autoClose(leftExpr), state.angleMode);
              newValue = leftValue * numValue / 100;
            }
          } catch {
            // fall through to plain divide-by-100
          }
        }

        state.expr = before + String(Number(newValue.toPrecision(PRECISION)));
        render();
      }

      function toggleSign() {
        ensureNoError();

        if (state.justEvaluated) {
          if (state.resultValue !== null) {
            const negated = -state.resultValue;
            state.expr = String(negated);
            state.resultValue = negated;
            state.resultStr = formatNumberForDisplay(negated);
          }
          render();
          return;
        }

        if (!state.expr) {
          state.expr = '-';
          render();
          return;
        }

        const match = state.expr.match(/[\d.]+$/);

        if (!match) {
          const last = state.expr[state.expr.length - 1];
          if ('+-*/^('.includes(last)) {
            state.expr += '-';
            render();
          }
          return;
        }

        const numStr = match[0];
        const before = state.expr.slice(0, state.expr.length - numStr.length);
        const lastChar = before.slice(-1);

        if (lastChar === '-') {
          const beforeMinus = before.slice(0, -1);
          const charBeforeMinus = beforeMinus.slice(-1);

          if (charBeforeMinus === '' || '+-*/^('.includes(charBeforeMinus)) {
            state.expr = beforeMinus + numStr;
          } else {
            state.expr = beforeMinus + '+' + numStr;
          }
        } else if (lastChar === '+') {
          state.expr = before.slice(0, -1) + '-' + numStr;
        } else {
          state.expr = before + '-' + numStr;
        }

        render();
      }

      function toggleAngleMode() {
        state.angleMode = state.angleMode === 'DEG' ? 'RAD' : 'DEG';

        if (angleButton) {
          angleButton.textContent = state.angleMode;
          angleButton.setAttribute(
            'aria-label',
            `Angle mode: ${state.angleMode}. Click to toggle.`
          );
        }

        render();
      }

      function resetState() {
        state.expr = '';
        state.resultValue = null;
        state.resultStr = '';
        state.lastExpression = '';
        state.error = null;
        state.justEvaluated = false;
      }

      function ensureNoError() {
        if (state.error) resetState();
      }

      function clearEvaluated() {
        if (state.justEvaluated) {
          state.expr = '';
          state.resultValue = null;
          state.resultStr = '';
          state.lastExpression = '';
          state.justEvaluated = false;
        }
      }

      /* ============================================================
         Render
         ============================================================ */
      function render() {
        if (state.error) {
          resultEl.textContent = 'Error';
          resultEl.classList.add('is-error');
          resultEl.dataset.size = 'lg';
          expressionEl.textContent = state.error;
          updateOperatorStates();
          copyBtn.disabled = true;
          return;
        }

        resultEl.classList.remove('is-error');
        copyBtn.disabled = false;

        if (state.justEvaluated && state.resultStr) {
          resultEl.textContent = state.resultStr;
          resultEl.dataset.size = getDisplaySize(state.resultStr);
          expressionEl.textContent = state.lastExpression;
        } else if (state.expr) {
          const displayText = formatExpression(state.expr);
          resultEl.textContent = displayText || '0';
          resultEl.dataset.size = getDisplaySize(displayText);

          const preview = computePreview();
          expressionEl.textContent = preview ? '= ' + preview : '';
        } else {
          resultEl.textContent = '0';
          resultEl.dataset.size = 'lg';
          expressionEl.textContent = '';
        }

        updateOperatorStates();
      }

      function updateOperatorStates() {
        const lastChar = state.expr ? state.expr[state.expr.length - 1] : '';
        operatorButtons.forEach((btn) => {
          const op = btn.dataset.operator;
          btn.setAttribute('aria-pressed', op === lastChar ? 'true' : 'false');
        });
      }

      /* ============================================================
         Mode
         ============================================================ */
      function setMode(mode) {
        state.mode = mode;
        const isSci = mode === 'scientific';

        calculator.classList.toggle('scientific', isSci);
        sciPanel.inert = !isSci;

        modeButtons.forEach((btn) => {
          const active = btn.dataset.mode === mode;
          btn.classList.toggle('is-active', active);
          btn.setAttribute('aria-pressed', active ? 'true' : 'false');
        });
      }

      /* ============================================================
         Copy
         ============================================================ */
      function indicateCopied() {
        copyBtn.classList.add('is-copied');
        copyBtn.setAttribute('aria-label', 'Copied');
        copyBtn.title = 'Copied';
        copyStatus.textContent = 'Result copied to clipboard';

        window.clearTimeout(copiedTimer);
        copiedTimer = window.setTimeout(() => {
          copyBtn.classList.remove('is-copied');
          copyBtn.setAttribute('aria-label', 'Copy result');
          copyBtn.title = 'Copy result';
          copyStatus.textContent = '';
        }, COPY_FEEDBACK_MS);
      }

      async function copyResult() {
        if (state.error) return;

        let text;
        if (state.justEvaluated && state.resultValue !== null) {
          text = String(state.resultValue);
        } else if (state.expr) {
          text = state.expr;
        } else {
          text = '0';
        }

        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
          } else {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.setAttribute('readonly', '');
            ta.style.position = 'fixed';
            ta.style.top = '-1000px';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            const ok = document.execCommand('copy');
            ta.remove();
            if (!ok) throw new Error('Copy failed');
          }
          indicateCopied();
        } catch {
          copyStatus.textContent = 'Copy failed';
        }
      }

      /* ============================================================
         Events
         ============================================================ */
      keypad.addEventListener('click', (event) => {
        const button = event.target.closest('button[data-action]');
        if (!button) return;

        switch (button.dataset.action) {
          case 'digit':
            inputDigit(button.dataset.digit);
            break;
          case 'operator':
            inputOperator(button.dataset.operator);
            break;
          case 'equals':
            equals();
            break;
          case 'clear':
            clearAll();
            break;
          case 'delete':
            backspace();
            break;
          case 'percent':
            percent();
            break;
          case 'sign':
            toggleSign();
            break;
          default:
            break;
        }
      });

      // Scientific panel uses its own delegated listener so its actions stay
      // scoped to that subtree.
      sciPanel.addEventListener('click', (event) => {
        const button = event.target.closest('button[data-action]');
        if (!button) return;

        switch (button.dataset.action) {
          case 'func':
            inputFunction(button.dataset.func);
            break;
          case 'constant':
            inputConstant(button.dataset.constant);
            break;
          case 'paren':
            if (button.dataset.paren === '(') inputParenLeft();
            else inputParenRight();
            break;
          case 'power':
            inputPower();
            break;
          case 'angle':
            toggleAngleMode();
            break;
          default:
            break;
        }
      });

      modeButtons.forEach((btn) => {
        btn.addEventListener('click', () => setMode(btn.dataset.mode));
      });

      copyBtn.addEventListener('click', copyResult);
      historyBtn.addEventListener('click', openHistory);
      closeHistoryBtn.addEventListener('click', closeHistory);
      clearHistoryBtn.addEventListener('click', clearHistory);

      // Blur mouse-activated buttons so global keyboard shortcuts keep working.
      document.addEventListener('pointerup', (event) => {
        if (event.pointerType !== 'mouse') return;
        const target = event.target;
        if (target instanceof Element) {
          const button = target.closest('button');
          if (button) button.blur();
        }
      });

      document.addEventListener('keydown', (event) => {
        if (event.defaultPrevented) return;
        if (event.altKey || event.ctrlKey || event.metaKey) return;

        const key = event.key;

        // While the history drawer is open, only Escape is handled globally.
        if (historyOpen) {
          if (key === 'Escape') {
            event.preventDefault();
            closeHistory();
          }
          return;
        }

        const target = event.target;

        if (
          target instanceof Element &&
          target.closest('button') &&
          (key === 'Enter' || key === ' ')
        ) {
          return;
        }

        if (key >= '0' && key <= '9') {
          event.preventDefault();
          inputDigit(key);
          return;
        }

        if (key === '.' || key === ',') {
          event.preventDefault();
          inputDigit('.');
          return;
        }

        switch (key) {
          case '+':
            event.preventDefault();
            inputOperator('+');
            break;
          case '-':
            event.preventDefault();
            inputOperator('-');
            break;
          case '*':
          case 'x':
          case 'X':
            event.preventDefault();
            inputOperator('*');
            break;
          case '/':
            event.preventDefault();
            inputOperator('/');
            break;
          case '^':
            event.preventDefault();
            inputPower();
            break;
          case '(':
            event.preventDefault();
            inputParenLeft();
            break;
          case ')':
            event.preventDefault();
            inputParenRight();
            break;
          case 'Enter':
          case '=':
            event.preventDefault();
            equals();
            break;
          case 'Backspace':
            event.preventDefault();
            backspace();
            break;
          case 'Delete':
          case 'Escape':
            event.preventDefault();
            clearAll();
            break;
          case '%':
            event.preventDefault();
            percent();
            break;
          case 'c':
          case 'C':
            event.preventDefault();
            clearAll();
            break;
          case 'h':
          case 'H':
            event.preventDefault();
            openHistory();
            break;
          case 's':
          case 'S':
            event.preventDefault();
            inputFunction('sin');
            break;
          case 'o':
          case 'O':
            event.preventDefault();
            inputFunction('cos');
            break;
          case 't':
          case 'T':
            event.preventDefault();
            inputFunction('tan');
            break;
          case 'p':
          case 'P':
            event.preventDefault();
            inputConstant('π');
            break;
          default:
            break;
        }
      });

      /* ============================================================
         Init
         ============================================================ */
      setMode('basic');
      renderHistory();
      render();
    })();
  </script>
</body>
</html>
